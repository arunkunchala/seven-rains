<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Microdrama Anthology</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
:root{--ink:#0B0B0F;--paper:#EFE6D2;--accent:#F2A33A;--cold:#3E6B85;--red:#C8352E;--dim:#8E8E98}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#000}
body{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;color:var(--paper)}
#app{position:fixed;inset:0;display:grid;place-items:center;background:#000}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none}
@media (min-aspect-ratio:3/4){.phone{width:auto;height:100%;aspect-ratio:9/16;box-shadow:0 0 0 1px #222}}

/* ============ LIBRARY ============ */
.lib{position:absolute;inset:0;z-index:60;background:#0B0B0F;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 30px) 18px calc(env(safe-area-inset-bottom,0px) + 30px);
  background-image:radial-gradient(rgba(255,255,255,.05) .6px,transparent .7px);background-size:3px 3px}
.lib.off{display:none}
.lib .brand{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#8E8E98}
.lib h1{font-family:"Bangers",Impact,sans-serif;font-weight:400;font-size:clamp(38px,10vw,54px);line-height:.92;
  margin:8px 0 6px;letter-spacing:.03em;color:#EFE6D2;text-shadow:4px 4px 0 #F2A33A}
.lib .note{font-size:14px;color:#9A9AA4;font-weight:600;margin:0 0 22px;line-height:1.45}
.card{display:block;width:100%;text-align:left;border:3px solid var(--paper);background:var(--ink);
  padding:0;margin-bottom:16px;box-shadow:7px 7px 0 var(--accent);cursor:pointer;overflow:hidden;
  transition:transform .1s,box-shadow .1s;font:inherit;color:inherit}
.card:active{transform:translate(3px,3px);box-shadow:4px 4px 0 var(--accent)}
.card .key{height:118px;position:relative;overflow:hidden;border-bottom:3px solid var(--paper)}
.card .key svg{position:absolute;inset:0;width:100%;height:100%}
.card .body{padding:13px 15px 15px}
.card .badge{display:inline-block;font-family:"Oswald",sans-serif;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;background:var(--accent);color:var(--ink);padding:2px 7px;font-weight:600}
.card h2{font-family:"Bangers",Impact,sans-serif;font-weight:400;font-size:29px;letter-spacing:.03em;
  margin:8px 0 1px;line-height:1;color:var(--paper)}
.card .sub{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.card .d{font-size:14.5px;color:#A8A29A;margin-top:8px;line-height:1.42;font-weight:600}
.card .meta{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:#6E6E78;margin-top:10px;border-top:2px solid rgba(239,230,210,.14);padding-top:8px}
.lib .foot{font-size:12.5px;color:#6E6E78;line-height:1.5;border-left:3px solid #2A2A33;padding-left:12px;margin-top:26px}

/* ============ HUD ============ */
.hud{position:absolute;left:0;right:0;top:0;z-index:30;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0 52px;display:flex;justify-content:space-between;align-items:center}
.hud .t{font-family:"Oswald",sans-serif;font-size:clamp(10px,1.5vh,12px);letter-spacing:.2em;text-transform:uppercase;color:var(--paper);opacity:.75}
.hud .clk{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(14px,2.1vh,18px);letter-spacing:.06em;
  color:var(--paper);background:var(--ink);padding:2px 8px;border:2px solid var(--paper);font-variant-numeric:tabular-nums}
.hud .clk.low{color:var(--red);border-color:var(--red)}
.hud .res{display:flex;gap:5px;align-items:center;opacity:0;transition:opacity .3s}
.hud .res.on{opacity:1}
.hud .res i{width:13px;height:13px;border:2.5px solid var(--paper);transform:rotate(45deg);background:var(--accent)}
.hud .res i.gone{background:transparent;border-color:#5A544A}
.back{position:absolute;left:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:34;
  font-family:"Oswald",sans-serif;font-size:20px;line-height:1;color:var(--paper);background:var(--ink);
  border:2px solid var(--paper);padding:3px 9px 5px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.back.on{opacity:.85;pointer-events:auto}
.seqbar{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 42px);
  display:flex;gap:3px;z-index:30;pointer-events:none}
.seqbar i{flex:1;height:3px;background:rgba(239,230,210,.18)}
.seqbar i.done{background:var(--accent)}
.obj{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:33;text-align:center;padding:0 10px;
  pointer-events:none;opacity:0;transition:opacity .35s}
.obj.on{opacity:1}
.obj span{display:inline-block;font-family:"Bangers",Impact,sans-serif;font-size:clamp(19px,3.1vh,26px);
  letter-spacing:.06em;color:var(--paper);background:var(--ink);border:3px solid var(--accent);padding:4px 14px 6px}

/* ============ COMIC PAGE ============ */
.page{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 58px) 10px calc(env(safe-area-inset-bottom,0px) + 14px);
  display:grid;gap:8px;z-index:5;
  background:radial-gradient(rgba(0,0,0,.09) .6px,transparent .7px) 0 0/3px 3px,linear-gradient(180deg,#141318,#0E0E12)}
.page[data-l="1"]{grid-template-rows:1fr}
.page[data-l="2"]{grid-template-rows:1fr 1fr}
.page[data-l="3"]{grid-template-rows:1fr 1fr 1fr}
.page[data-l="21"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1.25fr}
.page[data-l="21"] .panel:nth-child(3){grid-column:1/3}
.page[data-l="12"]{grid-template-columns:1fr 1fr;grid-template-rows:1.25fr 1fr}
.page[data-l="12"] .panel:nth-child(1){grid-column:1/3}
.panel{position:relative;overflow:hidden;background:#152233;border:4px solid var(--ink);
  box-shadow:0 0 0 2px var(--paper);opacity:0;transform:scale(.96);transition:opacity .22s,transform .22s}
.panel.on{opacity:1;transform:none}
.panel.tilt,.panel.on.tilt{transform:rotate(-1.2deg) scale(1.02)}
.panel svg{position:absolute;inset:0;width:100%;height:100%}
.ht{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5;
  background:radial-gradient(rgba(0,0,0,.55) .7px,transparent .8px) 0 0/4px 4px}
.wx{position:absolute;inset:-20% 0 0 0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(104deg,transparent 0 9px,rgba(200,225,245,.55) 9px 10px,transparent 10px 22px);
  animation:fall .55s linear infinite}
.wx.dust{opacity:.3;background:repeating-linear-gradient(96deg,transparent 0 14px,rgba(232,220,196,.4) 14px 15px,transparent 15px 34px);
  animation-duration:1.5s}
@keyframes fall{to{transform:translate(-40px,120px)}}
.page[data-l="21"] .panel:nth-child(-n+2) .bal,.page[data-l="12"] .panel:nth-child(n+2) .bal{max-width:88%;font-size:clamp(12px,1.85vh,15px)}

.cap{position:absolute;z-index:3;background:var(--ink);color:var(--paper);padding:5px 9px;
  font-family:"Oswald",sans-serif;font-size:clamp(11px,1.62vh,14px);letter-spacing:.06em;text-transform:uppercase;
  line-height:1.25;max-width:80%;border:2px solid var(--paper);opacity:0;transform:translateY(4px);
  transition:opacity .18s,transform .18s}
.cap.amber{background:var(--accent);color:var(--ink);border-color:var(--ink)}
.cap.on{opacity:1;transform:none}
.bal{position:absolute;z-index:4;background:#fff;color:#0B0B0F;border:3px solid #0B0B0F;border-radius:16px;
  padding:8px 11px;font-size:clamp(13px,2.05vh,17px);font-weight:700;text-transform:uppercase;line-height:1.2;
  max-width:72%;opacity:0;transform:scale(.9);transition:opacity .16s,transform .16s;text-wrap:balance}
.bal.on{opacity:1;transform:none}
.bal.shout{border-radius:6px;font-size:clamp(15px,2.4vh,20px);background:var(--paper)}
.bal.think{border-style:dashed}
.bal.radio{border-radius:6px;background:#111;color:var(--paper);border-color:var(--paper)}
.bal.flat{border-radius:3px;background:#DDE7E8;border-color:#0B0B0F}
.bal::after{content:"";position:absolute;width:0;height:0;border:10px solid transparent}
.bal[data-t="bl"]::after{left:18px;bottom:-19px;border-top-color:#0B0B0F;border-right-width:4px}
.bal[data-t="br"]::after{right:18px;bottom:-19px;border-top-color:#0B0B0F;border-left-width:4px}
.bal[data-t="tl"]::after{left:18px;top:-19px;border-bottom-color:#0B0B0F;border-right-width:4px}
.bal[data-t="tr"]::after{right:18px;top:-19px;border-bottom-color:#0B0B0F;border-left-width:4px}
.bal.radio[data-t]::after{border-top-color:var(--paper)}
.bal .who{display:block;font-family:"Oswald",sans-serif;font-size:10px;letter-spacing:.2em;color:#7A6B57;margin-bottom:2px}
.bal.radio .who{color:var(--accent)}
.sfx{position:absolute;z-index:5;font-family:"Bangers",Impact,sans-serif;font-size:clamp(28px,5.2vh,50px);
  letter-spacing:.04em;color:var(--accent);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);
  transform:rotate(-8deg);opacity:0;transition:opacity .12s}
.sfx.on{opacity:1}
.sfx.red{color:var(--red)}
.tapcue{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 15px);z-index:31;
  font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper);
  opacity:0;transition:opacity .3s;pointer-events:none}
.tapcue.on{opacity:.72;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.22}}

/* ============ INTERACTION LAYER ============ */
.ix{position:absolute;inset:0;z-index:20;display:none;
  background:radial-gradient(rgba(0,0,0,.09) .6px,transparent .7px) 0 0/3px 3px,linear-gradient(180deg,#141318,#0E0E12)}
.ix.on{display:block}
.ix .page{padding-top:calc(env(safe-area-inset-top,0px) + 116px)}
.ixhud{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:22;
  display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:10px}
.ixhud .lbl{font-family:"Bangers",Impact,sans-serif;font-size:clamp(21px,3.5vh,32px);color:var(--paper);
  -webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);letter-spacing:.04em;line-height:1}
.ixhud .lbl.threat{color:var(--red)}
.ixhud .lbl.ctx{color:var(--cold)}
.ixhud .cnt{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(14px,2.1vh,18px);background:var(--paper);
  color:var(--ink);padding:3px 9px;border:2px solid var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.ixbar{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 100px);height:6px;
  background:rgba(239,230,210,.2);border:2px solid var(--ink);z-index:22}
.ixbar i{display:block;height:100%;background:var(--accent);width:100%}
.howto{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  z-index:23;background:var(--ink);color:var(--paper);border:2px solid var(--paper);padding:8px 14px;
  font-family:"Oswald",sans-serif;font-size:clamp(11.5px,1.72vh,15px);letter-spacing:.13em;text-transform:uppercase;
  max-width:90%;text-align:center;pointer-events:none;transition:opacity .3s}
.howto.fade{opacity:0}
.stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-10deg) scale(.6);z-index:40;
  pointer-events:none;font-family:"Bangers",Impact,sans-serif;font-size:clamp(48px,8.6vh,84px);letter-spacing:.06em;
  color:var(--accent);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink);opacity:0;
  transition:opacity .12s,transform .18s cubic-bezier(.2,1.6,.4,1);text-align:center;width:100%}
.stamp.on{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}
.stamp[data-t="good"]{color:var(--paper)}
.stamp[data-t="miss"]{color:var(--red)}
.stamp small{display:block;font-family:"Oswald",sans-serif;font-size:clamp(11px,1.7vh,14px);letter-spacing:.18em;
  -webkit-text-stroke:0;text-shadow:none;color:var(--paper);margin-top:6px;text-transform:uppercase}

/* RUNNER */
.run{position:absolute;inset:0;overflow:hidden}
.run .road{position:absolute;left:0;right:0;top:42%;bottom:0;clip-path:polygon(40% 0,60% 0,118% 100%,-18% 100%);background:var(--road,#232C36)}
.run .stripes{position:absolute;left:0;right:0;top:42%;bottom:0;clip-path:polygon(40% 0,60% 0,118% 100%,-18% 100%);
  background:repeating-linear-gradient(180deg,transparent 0 30px,var(--stripe,rgba(239,230,210,.16)) 30px 44px)}
.run .lane{position:absolute;top:42%;bottom:0;width:3px;left:50%;background:rgba(239,230,210,.32);transform-origin:50% 0}
.run .ob{position:absolute;left:50%;top:42%;width:26%;aspect-ratio:1;transform:translate(-50%,-70%) scale(.2);will-change:transform}
.run .ob svg{width:100%;height:100%;overflow:visible}
.run .ob.tgt{cursor:pointer}
.run .ob.tgt::after{content:"";position:absolute;inset:6%;border:4px solid var(--red);border-radius:50%;
  animation:tp .7s ease-out infinite}
@keyframes tp{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.25);opacity:0}}
.run .pl{position:absolute;left:50%;bottom:8%;width:var(--plw,31%);aspect-ratio:.8;transform:translateX(-50%);
  transition:left .13s cubic-bezier(.3,0,.2,1);will-change:transform,left}
.run .pl.jump{animation:jmp .5s ease-out}
@keyframes jmp{0%{transform:translate(-50%,0) scale(1)}45%{transform:translate(-50%,-38%) scale(1.06)}100%{transform:translate(-50%,0) scale(1)}}
.run .hitfx{position:absolute;inset:0;background:var(--red);opacity:0;pointer-events:none;mix-blend-mode:screen}
.run .speed{position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(239,230,210,.5) 46px 47px,transparent 47px 90px);
  mask:linear-gradient(180deg,transparent 40%,#000 70%);-webkit-mask:linear-gradient(180deg,transparent 40%,#000 70%)}

/* SEARCH */
.hot{position:absolute;width:20%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);z-index:5}
.hot.found::after{content:"";position:absolute;inset:8%;border:3px solid var(--accent);border-radius:50%;box-shadow:0 0 0 3px var(--ink)}
.inset{pointer-events:none;position:absolute;left:8%;right:8%;bottom:calc(env(safe-area-inset-bottom,0px) + 21%);
  z-index:8;background:var(--paper);color:#0B0B0F;border:4px solid #0B0B0F;box-shadow:0 0 0 2px var(--paper),8px 8px 0 #0B0B0F;
  padding:10px 12px;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;opacity:0;
  transform:translateY(10px) rotate(-1deg);transition:opacity .18s,transform .18s}
.inset.on{opacity:1;transform:rotate(-1deg)}
.inset svg{width:62px;height:62px;border:3px solid #0B0B0F;background:#fff}
.inset b{font-family:"Oswald",sans-serif;font-size:clamp(10.5px,1.55vh,13px);letter-spacing:.16em;
  text-transform:uppercase;display:block;color:#7A6B57}
.inset span{font-size:clamp(13.5px,2.05vh,17px);font-weight:700;text-transform:uppercase;line-height:1.15}
.splat{position:absolute;transform:translate(-50%,-50%);font-family:"Bangers",Impact,sans-serif;
  font-size:clamp(19px,3.1vh,29px);color:var(--paper);-webkit-text-stroke:1.5px var(--ink);
  text-shadow:3px 3px 0 var(--ink);pointer-events:none;animation:pop .6s ease-out forwards;z-index:9}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-110%) scale(1.2)}}

/* TIMING */
.tim .track{position:absolute;left:12%;right:12%;bottom:calc(env(safe-area-inset-bottom,0px) + 30%);height:26px;
  background:var(--paper);border:4px solid var(--ink);z-index:9}
.tim .zone{position:absolute;top:0;bottom:0;background:var(--accent)}
.tim .mk{position:absolute;top:-10px;bottom:-10px;width:8px;background:var(--ink);transform:translateX(-50%)}
.tim .arm{position:absolute;right:-6%;top:12%;width:64%;height:14%;background:#B9A57A;border:4px solid var(--ink);
  border-radius:14px 40px 40px 14px;transform-origin:100% 50%;transform:rotate(-38deg);
  transition:transform .9s cubic-bezier(.5,0,.8,.4);z-index:6}

/* HOLD / CHARGE */
.holdring{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 9%);transform:translateX(-50%);
  width:clamp(72px,11.6vh,102px);height:clamp(72px,11.6vh,102px);z-index:9}
.holdring svg{width:100%;height:100%;transform:rotate(-90deg)}
.holdring{background:rgba(11,11,15,.55);border-radius:50%}
.holdring .ic{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bangers",Impact,sans-serif;
  font-size:clamp(15px,2.4vh,21px);color:var(--paper);-webkit-text-stroke:1.5px var(--ink);
  text-shadow:2px 2px 0 var(--ink);text-align:center;line-height:1}
.chargebar{position:absolute;left:16%;right:16%;bottom:calc(env(safe-area-inset-bottom,0px) + 26%);height:22px;
  background:var(--paper);border:4px solid var(--ink);z-index:9}
.chargebar .cz{position:absolute;top:0;bottom:0;background:var(--accent)}
.chargebar .cf{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cold);mix-blend-mode:multiply}

/* CHAIN (swipe/tap QTE sequence) */
.chain{position:absolute;inset:0}
.cue{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:9;text-align:center;
  opacity:0;transition:opacity .12s}
.cue.on{opacity:1}
.cue .arrow{width:clamp(84px,13.6vh,120px);height:clamp(84px,13.6vh,120px);margin:0 auto;position:relative}
.cue .arrow svg{width:100%;height:100%}
.cue .lbl2{font-family:"Bangers",Impact,sans-serif;font-size:clamp(17px,2.7vh,24px);letter-spacing:.06em;
  color:var(--paper);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);margin-top:4px}
.cue .arrow{filter:drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 0 16px rgba(0,0,0,.85))}
.cue .ringwrap{position:absolute;inset:-14%}
.cue .ringwrap svg circle{stroke-width:4}
.cue .ringwrap svg{transform:rotate(-90deg)}

/* RAPID TAP */
.mash{position:absolute;left:14%;right:14%;bottom:calc(env(safe-area-inset-bottom,0px) + 24%);z-index:9}
.mash .bar{height:26px;background:var(--paper);border:4px solid var(--ink);position:relative;overflow:hidden}
.mash .bar i{display:block;height:100%;width:0;background:var(--red);transition:width .07s linear}
.mash .hand{width:clamp(56px,8.6vh,74px);height:clamp(56px,8.6vh,74px);margin:14px auto 0;border:4px solid var(--paper);
  border-radius:50%;background:rgba(11,11,15,.55);display:grid;place-items:center;
  font-family:"Bangers",Impact,sans-serif;font-size:clamp(15px,2.4vh,20px);color:var(--paper);animation:mp .34s ease-in-out infinite}
@keyframes mp{50%{transform:scale(.9)}}

/* ============ CARDS ============ */
.card2{position:absolute;inset:0;z-index:50;background:var(--ink);display:grid;place-content:center;text-align:center;
  padding:0 8%;opacity:0;pointer-events:none;transition:opacity .3s}
.card2.on{opacity:1;pointer-events:auto}
.card2 .k{font-family:"Oswald",sans-serif;font-size:clamp(10.5px,1.55vh,13px);letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.card2 h1{font-family:"Bangers",Impact,sans-serif;font-weight:400;font-size:clamp(46px,9vh,86px);line-height:.92;
  margin:10px 0 0;color:var(--paper);-webkit-text-stroke:2px var(--ink);text-shadow:6px 6px 0 var(--accent);letter-spacing:.03em}
.card2 h1 b{display:block;font-size:.48em;color:var(--accent);text-shadow:4px 4px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink)}
.card2 p{font-size:clamp(13.5px,2.05vh,17px);line-height:1.45;color:#BFB29A;max-width:32ch;margin:18px auto 0;font-weight:600}
.btn{margin-top:24px;appearance:none;border:3px solid var(--paper);background:var(--paper);color:var(--ink);
  font-family:"Bangers",Impact,sans-serif;font-size:clamp(19px,2.9vh,25px);letter-spacing:.08em;padding:10px 32px;
  cursor:pointer;box-shadow:5px 5px 0 var(--accent)}

var ST=null, SC=null;
var S={pg:0,step:0,steps:[],running:false,t:0,order:[],busy:false,resolve:3,seq:0};
var last=performance.now(),idle=0,IXDONE=null;

function theme(t){var r=phone.style;
  r.setProperty('--ink',t.ink);r.setProperty('--paper',t.paper);
  r.setProperty('--accent',t.accent);r.setProperty('--cold',t.cold);r.setProperty('--red',t.red);}

function fmt(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function rel(e){var r=phone.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}

/* ---- library ---- */
function library(){
  S.running=false;ix.classList.remove('on');$('card2').classList.remove('on');$('dbrf').classList.remove('on');
  pageEl.innerHTML='';backEl.classList.remove('on');objEl.classList.remove('on');
  clk.style.display='none';resEl.classList.remove('on');hudT.textContent='';seqbar.innerHTML='';
  theme({ink:'#0B0B0F',paper:'#EFE6D2',accent:'#F2A33A',cold:'#3E6B85',red:'#C8352E'});
  var h='<div class="brand">Liquidnitro · Interactive Microdrama</div><h1>The Anthology</h1>'+
    '<p class="note">One engine, many stories. Comic panels you tap through, hypercasual mini-games as the action beats, twelve minutes a day.</p>';
  STORIES.forEach(function(s,i){
    h+='<button class="card" data-i="'+i+'"><div class="key">'+s.key+'<div class="ht"></div></div>'+
      '<div class="body"><span class="badge">'+s.badge+'</span>'+
      '<h2>'+s.title+'</h2><div class="sub">'+s.sub+'</div>'+
      '<div class="d">'+s.blurb+'</div><div class="meta">'+s.dur+'</div></div></button>';
  });
  h+='<div class="foot">Both slices run on the same page-and-mini-game engine — only the story data, palette and HUD differ. Project K uses placeholder figures throughout: no likenesses, no film-derived designs, and no green anywhere before the archive reveal.</div>';
  $('lib').innerHTML=h;$('lib').classList.remove('off');
  [].forEach.call($('lib').querySelectorAll('.card'),function(b){
    b.addEventListener('click',function(){open(+b.dataset.i)});});
}
function open(i){
  ST=STORIES[i];SC=(ST.id==='seven-rains')?SR_SC:K_SC;
  theme(ST.theme);$('lib').classList.add('off');backEl.classList.add('on');
  hudT.textContent=ST.hud.label;
  S={pg:0,step:0,steps:[],running:false,t:0,order:[],busy:false,resolve:ST.hud.max||3,seq:0};
  seqbar.innerHTML=Array(ST.seqs).fill('<i></i>').join('');
  if(ST.hud.type==='clock'){clk.style.display='';clk.textContent=fmt(ST.hud.len);resEl.classList.remove('on');}
  else{clk.style.display='none';drawRes();}
  var c=ST.openCard;
  $('card2').innerHTML='<div><div class="k">'+c.k+'</div><h1>'+c.t+'<b>'+c.b+'</b></h1><p>'+c.p+'</p>'+
    '<button class="btn" id="go">Begin</button></div>';
  $('card2').classList.add('on');
  $('go').addEventListener('click',function(){$('card2').classList.remove('on');S.running=true;last=performance.now();render(0);});
}
function drawRes(){
  if(!ST||ST.hud.type!=='resolve')return;
  var h='';for(var i=0;i<ST.hud.max;i++)h+='<i class="'+(i<S.resolve?'':'gone')+'"></i>';
  resEl.innerHTML=h;
}
backEl.addEventListener('click',function(e){e.stopPropagation();library();});

/* ---- pages ---- */
function render(i){
  var pg=ST.pages[i];
  if(pg.end){finish();return;}
  if(pg.seq){S.seq=pg.seq;
    for(var k=0;k<seqbar.children.length;k++)seqbar.children[k].className=(k<pg.seq-1)?'done':'';
    if(pg.obj){objT.textContent=pg.obj;objEl.classList.add('on');
      clearTimeout(render._o);render._o=setTimeout(function(){objEl.classList.remove('on')},2600);}
    if(ST.hud.type==='resolve'){S.resolve=ST.hud.max;drawRes();resEl.classList.remove('on');}
  }
  pageEl.setAttribute('data-l',pg.l);pageEl.innerHTML='';S.steps=[];
  pg.panels.forEach(function(p,pi){
    var d=document.createElement('div');d.className='panel'+(p.tilt?' tilt':'');
    d.innerHTML=SC[p.art]+'<div class="ht"></div>'+(p.wx?'<div class="wx'+(p.wx==='dust'?' dust':'')+'"></div>':'');
    p.items.forEach(function(it,ii){
      var e;
      if('cap' in it){e=document.createElement('div');e.className='cap'+(it.amber?' amber':'');e.textContent=it.cap;e.style.cssText=it.pos;}
      else if('bal' in it){e=document.createElement('div');e.className='bal '+it.kind;e.setAttribute('data-t',it.tail);
        e.innerHTML='<span class="who">'+it.who+'</span>'+it.bal;e.style.cssText=it.pos;}
      else{e=document.createElement('div');e.className='sfx'+(it.red?' red':'');e.textContent=it.sfx;e.style.cssText=it.pos;}
      e.setAttribute('data-step',pi+'.'+ii);d.appendChild(e);
    });
    pageEl.appendChild(d);
    S.steps.push({panel:pi});
    p.items.forEach(function(it,ii){if('bal' in it)S.steps.push({panel:pi,item:ii});});
  });
  S.step=0;doStep();
}
function doStep(){
  var st=S.steps[S.step];if(!st)return;
  var panel=pageEl.children[st.panel];
  if(st.item===undefined){
    panel.classList.add('on');
    [].forEach.call(panel.querySelectorAll('.cap,.sfx'),function(e,k){setTimeout(function(){e.classList.add('on')},110+k*150);});
  }else panel.querySelector('[data-step="'+st.panel+'.'+st.item+'"]').classList.add('on');
  S.step++;idle=0;tapcue.classList.remove('on');
}
function advance(){
  if(S.busy||!S.running)return;
  if(S.step<S.steps.length){doStep();return;}
  var pg=ST.pages[S.pg];
  if(pg.then&&!pg._done){pg._done=true;runIX(pg.then,function(){S.pg++;render(S.pg);});return;}
  S.pg++;render(S.pg);
}
phone.addEventListener('pointerdown',function(e){
  if(e.target.closest&&e.target.closest('button,.dbrf,.lib,.back'))return;
  e.preventDefault();
  if(ix.classList.contains('on'))return;
  advance();
},{passive:false});

/* ---- outcome ---- */
function stamp(tier,note){
  stampEl.setAttribute('data-t',tier);
  stampEl.innerHTML=(tier==='perfect'?'PERFECT!':tier==='good'?'GOOD':'MISS')+(note?'<small>'+note+'</small>':'');
  stampEl.classList.add('on');setTimeout(function(){stampEl.classList.remove('on')},1000);
}
function ixOpen(h){objEl.classList.remove('on');ix.innerHTML=h;ix.classList.add('on');S.busy=true;}
function ixClose(){ix.classList.remove('on');ix.innerHTML='';S.busy=false;}
function bar(el,f){el.style.width=(Math.max(0,1-f)*100)+'%';}
function runIX(name,done){IXDONE=done;var d=ST.ix[name];d._key=name;IXR[d.kind](d);}
function done(d,tier){
  S.order.push({k:d._key,t:tier,l:d.name});
  if(tier==='miss'&&ST.hud.type==='resolve'){S.resolve=Math.max(0,S.resolve-1);drawRes();resEl.classList.add('on');}
  stamp(tier,tier==='perfect'?d.good:tier==='good'?d.ok:d.miss);
  setTimeout(function(){ixClose();if(IXDONE)IXDONE();},1150);
}
function shell(d,inner,extra){
  var cap=d.cap?'<div class="cap on" style="top:8px;left:8px">'+d.cap+'</div>':'';
  var b=d.balloon?'<div class="bal on '+(d.balloon.kind||'')+'" data-t="'+(d.balloon.tail||'bl')+'" style="top:8px;left:8px">'+
    '<span class="who">'+d.balloon.who+'</span>'+d.balloon.t+'</div>':'';
  return '<div class="page" data-l="1" style="z-index:1"><div class="panel on" id="ixp">'+
    (d.bg?SC[d.bg]:'')+'<div class="ht"></div>'+cap+b+(inner||'')+'</div></div>'+
    '<div class="ixhud"><div class="lbl '+(d.tone||'')+'">'+d.lbl+'</div>'+(d.cnt?'<div class="cnt" id="cnt">'+d.cnt+'</div>':'')+'</div>'+
    (d.nobar?'':'<div class="ixbar"><i id="bar"></i></div>')+
    (extra||'')+'<div class="howto" id="howto">'+d.how+'</div>';
}
function fadeHow(el,ms,t){if(t>ms)el.classList.add('fade');}

/* ---- mini-games ---- */
var IXR={};

IXR.swipe=function(d){
  ixOpen(shell(d,'<div class="sfx on" style="top:30%;right:10%">'+(d.sfxT||'')+'</div>',
    '<div style="position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14%);transform:translateX(-50%);z-index:9;width:54px;height:54px;border:4px solid var(--accent);border-radius:50%;background:rgba(11,11,15,.6);animation:jmp 1s ease-in-out infinite"></div>'));
  var t0=performance.now(),dn=null,fin=false,bl=$('bar');
  function down(e){dn=rel(e)}
  function mv(e){if(!dn||fin)return;var p=rel(e);if(dn.y-p.y>.12){fin=true;off();
    var el=performance.now()-t0;done(d,el<d.perfect?'perfect':'good');}}
  function off(){ix.removeEventListener('pointerdown',down);ix.removeEventListener('pointermove',mv);}
  ix.addEventListener('pointerdown',down);ix.addEventListener('pointermove',mv);
  (function f(n){if(fin)return;var el=n-t0;bar(bl,el/d.dur);
    if(el>=d.dur){fin=true;off();done(d,'miss');return;}requestAnimationFrame(f);})(t0);
};

IXR.hold=function(d){
  ixOpen(shell(d,'','<div class="holdring"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="rgba(239,230,210,.25)" stroke-width="5"/>'+
    '<circle id="harc" cx="22" cy="22" r="19" fill="none" stroke="var(--accent)" stroke-width="5" stroke-dasharray="119.4" stroke-dashoffset="119.4" stroke-linecap="round"/></svg>'+
    '<div class="ic">'+(d.ic||'HOLD')+'</div></div>'));
  var arc=$('harc'),bl=$('bar'),t0=performance.now(),lt=t0,down=false,acc=0,rel2=0,fin=false;
  function dn(){down=true}function up(){if(down)rel2++;down=false}
  ix.addEventListener('pointerdown',dn);ix.addEventListener('pointerup',up);ix.addEventListener('pointercancel',up);
  (function f(n){if(fin)return;var dt=n-lt;lt=n;var el=n-t0;
    if(down)acc+=dt;
    arc.style.strokeDashoffset=(119.4*(1-Math.min(1,acc/d.need))).toFixed(1);
    bar(bl,el/d.dur);fadeHow($('howto'),3200,el);
    if(acc>=d.need){fin=true;done(d,rel2===0?'perfect':'good');return;}
    if(el>=d.dur){fin=true;done(d,'miss');return;}
    requestAnimationFrame(f);})(t0);
};

IXR.timing=function(d){
  ixOpen(shell(d,(d.arm?'<div class="arm" id="arm"></div>':''),
    '<div class="tim"><div class="track"><div class="zone" style="left:'+(50-d.zone/2)+'%;width:'+d.zone+'%"></div><div class="mk" id="mk"></div></div></div>'));
  var mk=$('mk'),bl=$('bar'),t0=performance.now(),fin=false;
  if(d.arm)setTimeout(function(){var a=$('arm');if(a)a.style.transform='rotate(10deg)'},300);
  (function f(n){if(fin)return;var el=n-t0;var x=50+Math.sin(el/260)*44;mk.style.left=x+'%';mk._x=x;
    bar(bl,el/d.dur);
    if(el>=d.dur){fin=true;done(d,'miss');return;}requestAnimationFrame(f);})(t0);
  ix.addEventListener('pointerdown',function(){
    if(fin)return;fin=true;var dd=Math.abs(mk._x-50);
    var t=dd<d.zone*.3?'perfect':dd<d.zone*.62?'good':'miss';
    var s=document.createElement('div');s.className='sfx on'+(t==='miss'?' red':'');
    s.textContent=t==='miss'?'MISS':'SNAP';s.style.cssText='top:44%;left:12%;z-index:9';ix.appendChild(s);
    done(d,t);});
};

IXR.search=function(d){
  d.cnt='0 / 3';
  ixOpen(shell(d,'','<div class="inset" id="inset"></div>'));
  var p=$('ixp'),inset=$('inset'),bl=$('bar'),cn=$('cnt'),found=0,t0=performance.now(),run=true,pen=0;
  d.hots.forEach(function(h){
    var e=document.createElement('div');e.className='hot';e.style.left=h.x+'%';e.style.top=h.y+'%';
    e.addEventListener('pointerdown',function(ev){ev.stopPropagation();if(!run)return;
      if(h.real&&!h._d){h._d=1;found++;e.classList.add('found');cn.textContent=found+' / 3';
        inset.innerHTML=h.art+'<div><b>'+h.t+'</b><span>'+h.d+'</span></div>';inset.classList.add('on');
        clearTimeout(inset._t);inset._t=setTimeout(function(){inset.classList.remove('on')},2500);
        if(found===3){run=false;done(d,(performance.now()-t0)<d.fast?'perfect':'good');}
      }else if(!h.real){pen+=1500;
        var s=document.createElement('div');s.className='splat';s.textContent='...';s.style.left=h.x+'%';s.style.top=h.y+'%';
        p.appendChild(s);setTimeout(function(){s.remove()},700);}
    });p.appendChild(e);});
  (function f(n){if(!run)return;var el=n-t0+pen;bar(bl,el/d.dur);fadeHow($('howto'),3400,el);
    if(el>=d.dur){run=false;done(d,found>=2?'good':'miss');return;}requestAnimationFrame(f);})(t0);
  d.hots.forEach(function(h){delete h._d});
};

IXR.runner=function(d){
  ixOpen('<div class="run" id="run" style="background:'+d.sky+';--road:'+(d.road||'#232C36')+';--stripe:'+(d.stripe||'rgba(239,230,210,.16)')+'">'+
    '<div class="road"></div><div class="stripes" id="str"></div>'+
    '<div class="lane" style="transform:rotate(17deg)"></div><div class="lane" style="transform:rotate(-17deg)"></div>'+
    '<div class="speed"></div><div id="obs"></div>'+
    '<div class="pl" id="pl" style="--plw:'+(d.plw||'31%')+'">'+(d.playerVB?'<svg viewBox="'+d.playerVB+'">'+d.player+'</svg>':d.player)+'</div>'+
    '<div class="hitfx" id="hitfx"></div>'+(d.rain?'<div class="wx"></div>':'')+(d.dust?'<div class="wx dust"></div>':'')+'</div>'+
    '<div class="ixhud"><div class="lbl '+(d.tone||'')+'">'+d.lbl+'</div><div class="cnt" id="cnt">0</div></div>'+
    '<div class="ixbar"><i id="bar"></i></div><div class="howto" id="howto">'+d.how+'</div>');
  var pl=$('pl'),obsEl=$('obs'),bl=$('bar'),hit=$('hitfx'),str=$('str'),cn=$('cnt'),how=$('howto');
  var lane=1,jump=false,hits=0,dodged=0,obs=[],t0=performance.now(),lastSp=0,run=true,sy=0,dn=null,spawned=0;
  var LX=[27,50,73];
  function setL(){pl.style.left=LX[lane]+'%'}
  setL();
  function spawn(now){
    spawned++;
    var isT=d.targets&&d.targetEvery&&(spawned%d.targetEvery===0);
    var ty=isT?d.targets:d.types[Math.floor(Math.random()*d.types.length)];
    var e=document.createElement('div');e.className='ob'+(isT?' tgt':'');e.innerHTML=d.obs[ty];
    obsEl.appendChild(e);
    var o={el:e,l:Math.floor(Math.random()*3),born:now,ty:ty,tgt:isT,hit:false,pass:false,z:0};
    if(isT)e.addEventListener('pointerdown',function(ev){ev.stopPropagation();if(o.hit||o.pass)return;
      o.hit=true;o.pass=true;dodged++;cn.textContent=dodged;e.style.opacity=.15;
      var s=document.createElement('div');s.className='splat';s.textContent='HIT!';
      s.style.left='50%';s.style.top='46%';ix.appendChild(s);setTimeout(function(){s.remove()},700);});
    obs.push(o);
  }
  (function f(now){
    if(!run)return;var el=now-t0,sp=1+Math.min(1,el/d.dur)*.9;
    bar(bl,el/d.dur);sy+=6*sp;str.style.backgroundPositionY=sy+'px';
    if(el>1800&&el<d.dur-2200&&now-lastSp>(1050-Math.min(400,el/60))/sp){lastSp=now;spawn(now);}
    for(var i=obs.length-1;i>=0;i--){
      var o=obs[i];o.z=(now-o.born)/(1700/sp);
      if(o.z>1.15){o.el.remove();obs.splice(i,1);continue;}
      var z=Math.min(1.05,o.z),y=42+z*z*50,s2=.18+z*z*1.15,x=50+(o.l-1)*(6+z*z*26);
      o.el.style.transform='translate(-50%,-70%) scale('+s2+')';o.el.style.left=x+'%';o.el.style.top=y+'%';
      if(!o.hit&&!o.pass&&o.z>.86&&o.z<1.0&&o.l===lane){
        if(o.ty===d.jumpType&&jump){}
        else{o.hit=true;hits++;hit.style.opacity=.32;setTimeout(function(){hit.style.opacity=0},120);
          pl.animate([{filter:'brightness(1)'},{filter:'brightness(3)'},{filter:'brightness(1)'}],220);
          var s=document.createElement('div');s.className='splat';
          s.textContent=o.tgt?'MISSED!':(o.ty===d.jumpType?'SPLASH!':'THUNK!');
          s.style.left='50%';s.style.top='58%';ix.appendChild(s);setTimeout(function(){s.remove()},700);}
      }
      if(!o.hit&&!o.pass&&o.z>=1.0){o.pass=true;if(!o.tgt){dodged++;cn.textContent=dodged;}}
    }
    fadeHow(how,3600,el);
    if(el>=d.dur){run=false;done(d,hits===0?'perfect':hits<=2?'good':'miss');return;}
    requestAnimationFrame(f);})(t0);
  ix.addEventListener('pointerdown',function(e){dn=rel(e)});
  ix.addEventListener('pointerup',function(e){
    if(!dn)return;var p=rel(e),dx=p.x-dn.x,dy=p.y-dn.y;dn=null;
    if(Math.abs(dx)<.06&&Math.abs(dy)<.06){lane=p.x<.5?Math.max(0,lane-1):Math.min(2,lane+1);setL();return;}
    if(dy<-.08&&Math.abs(dy)>Math.abs(dx)){if(!jump){jump=true;pl.classList.add('jump');
      setTimeout(function(){jump=false;pl.classList.remove('jump')},500);}return;}
    if(dx>.05)lane=Math.min(2,lane+1);else if(dx<-.05)lane=Math.max(0,lane-1);setL();});
};

var ARROW={
 up:'<path d="M50,8 L86,52 L64,52 L64,92 L36,92 L36,52 L14,52 Z"/>',
 down:'<path d="M50,92 L14,48 L36,48 L36,8 L64,8 L64,48 L86,48 Z"/>',
 left:'<path d="M8,50 L52,14 L52,36 L92,36 L92,64 L52,64 L52,86 Z"/>',
 right:'<path d="M92,50 L48,86 L48,64 L8,64 L8,36 L48,36 L48,14 Z"/>',
 tap:'<circle cx="50" cy="50" r="26"/><circle cx="50" cy="50" r="40" fill="none" stroke-width="7"/>'
};
IXR.chain=function(d){
  d.cnt='0 / '+d.steps.length;
  ixOpen(shell(d,'','<div class="chain"><div class="cue" id="cue">'+
    '<div class="arrow"><div class="ringwrap"><svg viewBox="0 0 44 44"><circle id="carc" cx="22" cy="22" r="20" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="125.6" stroke-linecap="round"/></svg></div>'+
    '<svg viewBox="0 0 100 100"><g id="cg" fill="var(--accent)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"></g></svg></div>'+
    '<div class="lbl2" id="clbl"></div></div></div>'));
  var cue=$('cue'),cg=$('cg'),clbl=$('clbl'),carc=$('carc'),cn=$('cnt'),bl=$('bar');
  var i=-1,hits=0,perf=0,openT=0,waiting=false,fin=false,t0=performance.now(),dn=null;
  function next(){
    i++;if(i>=d.steps.length){fin=true;
      done(d,perf>=d.steps.length-1?'perfect':hits>=d.steps.length-2?'good':'miss');return;}
    cg.innerHTML=ARROW[d.steps[i][0]];clbl.textContent=d.steps[i][1];
    cue.classList.add('on');openT=performance.now();waiting=true;
  }
  function resolve(ok){
    if(!waiting)return;waiting=false;cue.classList.remove('on');
    var re=performance.now()-openT;
    if(ok){hits++;if(re<=d.perfect)perf++;}
    cn.textContent=hits+' / '+d.steps.length;
    var s=document.createElement('div');s.className='splat'+(ok?'':'');
    s.textContent=ok?(re<=d.perfect?'PERFECT':'GOOD'):'MISS';
    s.style.left='50%';s.style.top='40%';ix.appendChild(s);setTimeout(function(){s.remove()},650);
    setTimeout(next,340);
  }
  setTimeout(next,700);
  (function f(n){if(fin)return;var el=n-t0;bar(bl,el/d.dur);fadeHow($('howto'),3800,el);
    if(waiting){var w=(n-openT)/d.win;carc.style.strokeDashoffset=(125.6*Math.min(1,w)).toFixed(1);
      if(w>=1)resolve(false);}
    if(el>=d.dur&&!fin){fin=true;done(d,hits>=d.steps.length-2?'good':'miss');return;}
    requestAnimationFrame(f);})(t0);
  ix.addEventListener('pointerdown',function(e){dn=rel(e)});
  ix.addEventListener('pointerup',function(e){
    if(!dn||!waiting)return;var p=rel(e),dx=p.x-dn.x,dy=p.y-dn.y;dn=null;
    var want=d.steps[i][0],got;
    if(Math.abs(dx)<.06&&Math.abs(dy)<.06)got='tap';
    else if(Math.abs(dy)>Math.abs(dx))got=dy<0?'up':'down';
    else got=dx<0?'left':'right';
    resolve(got===want);});
};

IXR.mash=function(d){
  d.cnt='0 / '+d.need;
  ixOpen(shell(d,'','<div class="mash"><div class="bar"><i id="mf"></i></div><div class="hand">TAP</div></div>'+
    (d.charge?'<div class="chargebar" id="cbar" style="display:none"><div class="cz" id="cz"></div><div class="cf" id="cf"></div></div>':'')));
  var mf=$('mf'),bl=$('bar'),cn=$('cnt'),t0=performance.now(),taps=0,fin=false,phase=1,cs=0,cdir=1,held=false;
  var zl=38,zw=26;
  function tap(){if(fin||phase!==1)return;taps++;cn.textContent=taps+' / '+d.need;
    mf.style.width=Math.min(100,taps/d.need*100)+'%';
    if(taps>=d.need){
      if(!d.charge){fin=true;done(d,'perfect');return;}
      phase=2;$('howto').textContent='Hold to charge — release in the gold';$('howto').classList.remove('fade');
      var cb=$('cbar');cb.style.display='';$('cz').style.cssText='left:'+zl+'%;width:'+zw+'%';
      $('cnt').textContent='LEAP';}
  }
  ix.addEventListener('pointerdown',function(){if(phase===1)tap();else held=true;});
  ix.addEventListener('pointerup',function(){
    if(phase!==2||!held||fin)return;held=false;fin=true;
    var t=(cs>=zl&&cs<=zl+zw)?(Math.abs(cs-(zl+zw/2))<zw*.28?'perfect':'good'):'miss';
    done(d,t);});
  (function f(n){if(fin)return;var el=n-t0;
    if(phase===1){bar(bl,el/d.dur);fadeHow($('howto'),2600,el);
      if(el>=d.dur){fin=true;done(d,taps>=d.need*.6?'good':'miss');return;}}
    else{if(held){cs+=cdir*1.5;if(cs>=100){cs=100;cdir=-1}if(cs<=0){cs=0;cdir=1}}
      var cf=$('cf');if(cf)cf.style.width=cs+'%';
      if(el>d.dur+5200){fin=true;done(d,'miss');return;}}
    requestAnimationFrame(f);})(t0);
};

/* ---- debrief ---- */
function finish(){
  S.running=false;
  for(var k=0;k<seqbar.children.length;k++)if(k<S.seq)seqbar.children[k].className='done';
  var rows=S.order.map(function(r,i){
    var d=ST.ix[r.k];
    return '<div class="res2"><span class="n">'+(i+1)+'</span><span class="w">'+r.l+
      '<small>'+({runner:'Mini-game · lane runner',search:'Mini-game · spot it',chain:'Mini-game · QTE chain',
        mash:'Mini-game · rapid tap + charge',timing:'QTE · timing tap',hold:'QTE · hold',swipe:'QTE · swipe'})[d.kind]+'</small></span>'+
      '<span class="st '+r.t+'">'+({perfect:'PERFECT',good:'GOOD',miss:'MISS'})[r.t]+'</span></div>';}).join('');
  var p=S.order.filter(function(r){return r.t==='perfect'}).length;
  var m=S.order.filter(function(r){return r.t==='miss'}).length;
  var head=ST.hud.type==='clock'?fmt(S.t)+' of '+fmt(ST.hud.len)+' used':(S.resolve+' of '+ST.hud.max+' Resolve');
  $('dbrf').innerHTML='<h2>End of<br>'+(ST.id==='last-drop'?'Sequence Three':'Sequence One')+'</h2>'+
    '<div class="sb">'+head+' · '+S.order.length+' interactions · '+p+' perfect · '+m+' missed</div>'+rows+
    '<div class="note2"><b>'+ST.outro.done+'</b> '+ST.outro.note+'</div>'+
    '<div class="map"><h3>Where this sits in the episode</h3>'+
    ST.map.map(function(r){return '<div class="seg'+(r[3]?' done':'')+'"><b>'+r[0]+'</b><span>'+r[1]+' — <em>'+r[2]+'</em></span></div>';}).join('')+'</div>'+
    '<div style="text-align:center;margin-top:8px"><button class="btn" id="again">Play again</button>'+
    '<button class="btn alt" id="lib2" style="margin-left:8px">Library</button></div>';
  $('dbrf').classList.add('on');
  $('again').addEventListener('click',function(){
    $('dbrf').classList.remove('on');ST.pages.forEach(function(p){delete p._done});
    S={pg:0,step:0,steps:[],running:false,t:0,order:[],busy:false,resolve:ST.hud.max||3,seq:0};
    for(var i=0;i<seqbar.children.length;i++)seqbar.children[i].className='';
    drawRes();setTimeout(function(){S.running=true;last=performance.now();render(0);},220);});
  $('lib2').addEventListener('click',function(){ST.pages.forEach(function(p){delete p._done});library();});
}

/* ---- loop ---- */
(function loop(n){
  var dt=(n-last)/1000;last=n;
  if(S.running&&ST){S.t+=dt;idle+=dt;
    if(ST.hud.type==='clock'){var lf=ST.hud.len-S.t;clk.textContent=fmt(lf);clk.classList.toggle('low',lf<120);}
    if(idle>4&&!S.busy&&S.steps.length)tapcue.classList.add('on');}
  requestAnimationFrame(loop);})(performance.now());

library();
})();
</script>
