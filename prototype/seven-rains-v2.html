<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seven Rains Episode One</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --amber:#F0A64B;
  --cold:#5B8AA3;
  --blood:#C75048;
  --paper:#F2EFE8;
  --ink:#05070A;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#000}
body{font-family:"Barlow",system-ui,-apple-system,sans-serif;color:var(--paper)}

#app{position:fixed;inset:0;display:grid;place-items:center;background:#000}
.phone{
  position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;
}
@media (min-aspect-ratio: 3/4){
  .phone{width:auto;height:100%;aspect-ratio:9/16;box-shadow:0 0 0 1px #1a1f26, 0 40px 120px -30px #000}
}

/* ---------- camera ---------- */
.world{
  position:absolute;inset:0;
  transform:scale(var(--cs,1)) translate(var(--cx,0px),var(--cy,0px));
  transition:transform var(--cd,1200ms) cubic-bezier(.33,0,.15,1);
  will-change:transform;
}
.shot{position:absolute;inset:-8%;opacity:0}
.shot.on{opacity:1}

/* environments */
.env{position:absolute;inset:0}
.env-office{background:
  radial-gradient(120% 70% at 22% 8%, rgba(96,150,178,.30), transparent 60%),
  radial-gradient(90% 60% at 88% 92%, rgba(240,166,75,.10), transparent 65%),
  linear-gradient(175deg,#0D161D,#060A0E 70%);}
.env-glass{background:
  radial-gradient(100% 62% at 50% 28%, rgba(126,184,214,.34), transparent 66%),
  linear-gradient(180deg,#0E1822,#05080B);}
.env-corridor{background:
  radial-gradient(80% 50% at 50% 6%, rgba(240,166,75,.34), transparent 62%),
  radial-gradient(70% 45% at 50% 100%, rgba(240,166,75,.12), transparent 60%),
  linear-gradient(180deg,#12100C,#06070A 78%);}
.env-bench{background:
  radial-gradient(52% 38% at 50% 50%, rgba(244,188,120,.40), transparent 72%),
  linear-gradient(180deg,#0C0E13,#040507);}

/* window with rain */
.win{position:absolute;left:6%;top:8%;width:60%;height:34%;border-radius:2px;
  background:linear-gradient(180deg,rgba(120,170,200,.20),rgba(70,110,140,.07));
  box-shadow:inset 0 0 0 1px rgba(150,190,215,.16);overflow:hidden}
.win::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(101deg,rgba(210,235,255,.10) 0 1px,transparent 1px 7px)}
.blind{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(5,8,12,.5) 0 5px,transparent 5px 13px)}

/* light shafts */
.shaft{position:absolute;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(180deg,rgba(240,200,150,.16),transparent 72%);filter:blur(9px)}

/* ---------- figures ---------- */
.fig{position:absolute;left:var(--x);bottom:var(--y);width:var(--w);
  transform:translateX(-50%);
  filter:drop-shadow(var(--rimx,4px) -3px 2px var(--rim,rgba(120,180,210,.85)))
         drop-shadow(-2px 0 10px rgba(0,0,0,.85));}
.fig .head{width:54%;margin:0 auto;aspect-ratio:.84;background:var(--tone,#141B22);
  border-radius:50% 50% 44% 44%/56% 56% 44% 44%;position:relative}
.fig .hair{position:absolute;left:-7%;right:-7%;top:-9%;height:56%;background:var(--hair,#0A0F14);
  border-radius:50% 50% 38% 38%/62% 62% 40% 40%}
.fig .hair.bun{left:-12%;right:-12%;height:46%;border-radius:50%}
.fig .neck{width:20%;height:9%;margin:-3% auto 0;background:var(--tone,#141B22)}
.fig .torso{width:100%;height:var(--th,62%);margin-top:-2%;background:var(--tone2,#0C1218);
  border-radius:46% 46% 6% 6%/34% 34% 4% 4%}
.fig .eye{position:absolute;top:47%;width:11%;height:3.2%;border-radius:2px;background:var(--eye,rgba(226,240,250,.82))}
.fig .eye.l{left:22%}.fig .eye.r{right:22%}
.fig .mouth{position:absolute;bottom:19%;left:50%;transform:translateX(-50%);width:20%;height:2px;
  border-radius:2px;background:rgba(180,150,140,.42)}
.fig.away .eye{opacity:.25}
.fig.small{--th:56%}

/* props */
.prop{position:absolute}
.doc{width:46%;left:27%;bottom:34%;aspect-ratio:.74;background:linear-gradient(175deg,#EDE7DA,#C9C2B2);
  border-radius:2px;box-shadow:0 10px 26px rgba(0,0,0,.6);padding:9% 8%;overflow:hidden}
.doc .ln{height:2.5%;background:rgba(30,35,42,.30);margin-bottom:5.5%;border-radius:1px}
.doc .ln.s{width:52%}.doc .ln.t{width:74%}
.doc .stamp{position:absolute;right:9%;bottom:11%;width:34%;aspect-ratio:1;border:2.5px solid rgba(180,60,52,.6);
  border-radius:50%;transform:rotate(-14deg)}
.doc .hd{font-family:"Oswald",sans-serif;color:#2A3038;font-size:clamp(9px,2.6vh,15px);
  letter-spacing:.12em;margin-bottom:7%;opacity:.72}

.torn{position:absolute;inset:0;pointer-events:none;opacity:0}
.torn i{position:absolute;top:0;bottom:0;width:50%;background:inherit}

.mic{position:absolute;width:14%;left:80%;bottom:44%;aspect-ratio:.34;border-radius:22% 22% 40% 40%;
  background:linear-gradient(180deg,#39414A,#171C22);box-shadow:-4px 0 12px rgba(0,0,0,.7)}
.flashbulb{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

.draw{width:50%;left:25%;bottom:36%;aspect-ratio:.78;background:#E9E2CE;border-radius:2px;
  box-shadow:0 14px 30px rgba(0,0,0,.7);overflow:hidden}
.draw .sky{position:absolute;left:0;right:0;top:0;height:34%;background:rgba(120,160,190,.35)}
.draw .grd{position:absolute;left:0;right:0;bottom:0;height:22%;background:rgba(120,140,90,.4)}
.draw .bld{position:absolute;left:8%;bottom:22%;width:26%;height:44%;background:rgba(120,140,160,.5)}
.draw .coat{position:absolute;left:56%;bottom:22%;width:19%;height:36%;background:#E0B23A;border-radius:44% 44% 12% 12%}
.draw .coat::after{content:"";position:absolute;left:50%;top:-32%;transform:translateX(-50%);
  width:62%;aspect-ratio:1;border-radius:50%;background:#3A3026}
.draw .fold{position:absolute;left:0;right:0;top:0;height:52%;background:linear-gradient(180deg,#DDD5C0,#CFC6AE);
  transform-origin:50% 0;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.draw .scrawl{position:absolute;left:9%;bottom:6%;font-family:"Barlow",sans-serif;font-size:clamp(8px,2vh,13px);
  color:#5A5344;letter-spacing:.04em}

/* ---------- overlays ---------- */
.scrim{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;z-index:8;
  background:linear-gradient(180deg,transparent,rgba(3,5,8,.62) 42%,rgba(3,5,8,.92) 78%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.5) .5px,transparent .5px);background-size:3px 3px}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 78% at 50% 44%,transparent 42%,rgba(0,0,0,.78) 100%)}
#rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.34}

/* ---------- subtitles ---------- */
.subs{position:absolute;left:0;right:0;bottom:calc(15% + env(safe-area-inset-bottom,0px));
  padding:0 8%;text-align:center;pointer-events:none;z-index:20}
.who{font-family:"Oswald",sans-serif;font-size:clamp(10px,1.5vh,13px);letter-spacing:.24em;
  text-transform:uppercase;color:var(--amber);margin-bottom:5px;opacity:.9}
.line{font-size:clamp(19px,3.05vh,29px);line-height:1.28;font-weight:500;text-wrap:balance;
  text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9)}
.line.vo{font-style:italic;font-weight:400;color:#CFDCE4}
.subs.hide{opacity:0}
.subs{transition:opacity .18s}

/* ---------- beat prompt ---------- */
.prompt{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(5.5% + env(safe-area-inset-bottom,0px));z-index:24;text-align:center;
  pointer-events:none;opacity:0;transition:opacity .16s}
.prompt.on{opacity:1}
.prompt .verb{font-family:"Oswald",sans-serif;font-size:clamp(13px,1.95vh,18px);letter-spacing:.22em;
  text-transform:uppercase;color:var(--paper);text-shadow:0 2px 10px #000}
.ring{position:relative;width:clamp(46px,7.2vh,64px);height:clamp(46px,7.2vh,64px);margin:0 auto 8px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .glyph{position:absolute;inset:0;display:grid;place-items:center;
  font-size:clamp(19px,2.9vh,26px);color:var(--amber);animation:bob 1.05s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.prompt[data-still="1"] .glyph{animation:none}

/* touch guides */
.zone{position:absolute;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .2s}
.zone.on{opacity:1}
.zone.pulse{box-shadow:0 0 0 0 rgba(240,166,75,.5);animation:zp 1.1s ease-out infinite}
@keyframes zp{70%{box-shadow:0 0 0 26px rgba(240,166,75,0)}100%{box-shadow:0 0 0 0 rgba(240,166,75,0)}}

.tapleft,.tapright{position:absolute;bottom:0;top:46%;width:50%;z-index:22;opacity:0;transition:opacity .12s}
.tapleft{left:0;background:linear-gradient(90deg,rgba(240,166,75,.18),transparent)}
.tapright{right:0;background:linear-gradient(-90deg,rgba(240,166,75,.18),transparent)}
.tapleft.lit,.tapright.lit{opacity:1}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px));z-index:26;
  padding:14px 16px 0;display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;font-family:"Oswald",sans-serif}
.ep{font-size:clamp(10px,1.4vh,12px);letter-spacing:.2em;text-transform:uppercase;color:rgba(226,236,244,.55)}
.clock{font-size:clamp(13px,1.9vh,17px);letter-spacing:.06em;color:var(--amber);font-variant-numeric:tabular-nums}
.dots{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 40px);
  display:flex;gap:4px;z-index:26;pointer-events:none}
.dots i{flex:1;height:2px;background:rgba(226,236,244,.16);border-radius:2px;overflow:hidden}
.dots i b{display:block;height:100%;width:0;background:var(--amber)}
.dots i[data-t="rough"] b{background:var(--cold)}
.dots i[data-t="missed"] b{background:rgba(199,80,72,.7)}

/* ---------- title cards ---------- */
.card{position:absolute;inset:0;z-index:40;display:grid;place-content:center;text-align:center;
  padding:0 10%;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .3s}
.card.on{opacity:1;pointer-events:auto}
.card .kicker{font-family:"Oswald",sans-serif;font-size:clamp(10px,1.5vh,12px);letter-spacing:.28em;
  text-transform:uppercase;color:var(--amber);margin-bottom:14px}
.card h1{font-family:"Oswald",sans-serif;font-weight:300;font-size:clamp(34px,6.6vh,58px);
  line-height:1;letter-spacing:.01em;margin:0 0 6px;text-transform:uppercase}
.card h1 b{display:block;font-weight:600}
.card p{font-size:clamp(14px,2.1vh,17px);line-height:1.5;color:#A9BAC6;margin:16px 0 0;max-width:30ch;
  margin-left:auto;margin-right:auto}
.btn{margin-top:28px;appearance:none;border:1px solid var(--amber);background:transparent;color:var(--amber);
  font-family:"Oswald",sans-serif;font-size:clamp(14px,2vh,17px);letter-spacing:.2em;text-transform:uppercase;
  padding:14px 34px;border-radius:2px;cursor:pointer}
.btn:active{background:var(--amber);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

/* interstitial */
.inter{position:absolute;inset:0;z-index:38;display:grid;place-content:center;text-align:center;
  background:var(--ink);opacity:0;pointer-events:none;transition:opacity .22s}
.inter.on{opacity:1}
.inter .n{font-family:"Oswald",sans-serif;font-size:clamp(11px,1.6vh,13px);letter-spacing:.3em;
  color:var(--amber);text-transform:uppercase}
.inter .h{font-family:"Oswald",sans-serif;font-weight:300;font-size:clamp(24px,4.4vh,38px);
  margin-top:8px;text-transform:uppercase;line-height:1.1}

/* debrief */
.dbrf{position:absolute;inset:0;z-index:42;background:var(--ink);opacity:0;pointer-events:none;
  overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 34px) 26px calc(env(safe-area-inset-bottom,0px) + 34px);
  transition:opacity .3s}
.dbrf.on{opacity:1;pointer-events:auto}
.dbrf h2{font-family:"Oswald",sans-serif;font-weight:300;font-size:clamp(26px,4.6vh,38px);
  text-transform:uppercase;margin:0 0 4px}
.dbrf .sb{font-size:clamp(13px,1.9vh,15px);color:#8FA3B0;margin-bottom:22px}
.row{display:grid;grid-template-columns:14px 1fr;gap:11px;padding:11px 0;
  border-top:1px solid rgba(226,236,244,.10);align-items:start}
.row .g{font-size:15px;line-height:1.15}
.row .x{font-size:clamp(13px,1.95vh,15px);line-height:1.42}
.row .x small{display:block;font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:#61727E;margin-top:3px}
.row[data-t="clean"] .x{color:var(--paper)}
.row[data-t="rough"] .x{color:#9FB4C1}
.row[data-t="missed"] .x{color:#63737E}
.stinger{border-left:2px solid var(--amber);padding:12px 0 12px 14px;margin:24px 0 0;
  font-size:clamp(13px,1.95vh,15px);line-height:1.5;color:#C3D2DC}
.stinger b{color:var(--amber)}
.next{margin-top:26px;text-align:center;font-family:"Oswald",sans-serif}
.next .lbl{font-size:11px;letter-spacing:.26em;color:#61727E;text-transform:uppercase}
.next .cd{font-size:clamp(26px,4.4vh,36px);color:var(--paper);font-variant-numeric:tabular-nums;letter-spacing:.05em}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
  .world{transition-duration:.01ms !important}
}
</style>

<div id="app"><div class="phone" id="phone">

  <div class="world" id="world"></div>

  <canvas id="rain"></canvas>
  <div class="scrim"></div>
  <div class="grain"></div>
  <div class="vig"></div>
  <div class="flashbulb" id="flash"></div>

  <div class="tapleft" id="tapL"></div>
  <div class="tapright" id="tapR"></div>

  <div class="hud">
    <div class="ep">Seven Rains · Ep 1</div>
    <div class="clock" id="clock">05:41</div>
  </div>
  <div class="dots" id="dots"></div>

  <div class="subs" id="subs"><div class="who" id="who"></div><div class="line" id="line"></div></div>

  <div class="prompt" id="prompt">
    <div class="ring">
      <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="none" stroke="rgba(226,236,244,.18)" stroke-width="2"/>
      <circle id="arc" cx="22" cy="22" r="20" fill="none" stroke="#F0A64B" stroke-width="2"
        stroke-linecap="round" stroke-dasharray="125.6" stroke-dashoffset="0"/></svg>
      <div class="glyph" id="glyph">↑</div>
    </div>
    <div class="verb" id="verb"></div>
  </div>

  <div class="inter" id="inter"><div class="n" id="interN"></div><div class="h" id="interH"></div></div>

  <div class="card on" id="opencard">
    <div class="kicker">Day 1 of 7 · 100 seconds</div>
    <h1>Seven Rains<b>First Rain</b></h1>
    <p>Nine gestures. No menus, no choices, no way to lose. What changes is what she walks out knowing.</p>
    <p style="font-size:.85em;color:#61727E">Best on a phone, held in one hand. Sound off — it's built that way.</p>
    <button class="btn" id="start">Begin</button>
  </div>

  <div class="dbrf" id="dbrf"></div>

</div></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var phone=$('phone'), world=$('world'), subs=$('subs'), whoEl=$('who'), lineEl=$('line');
var promptEl=$('prompt'), verbEl=$('verb'), glyphEl=$('glyph'), arcEl=$('arc');
var dotsEl=$('dots'), clockEl=$('clock'), interEl=$('inter'), flashEl=$('flash');
var tapL=$('tapL'), tapR=$('tapR');
var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= rain ================= */
var cv=$('rain'), cx=cv.getContext('2d'), drops=[], rainOn=true;
function sizeRain(){var r=phone.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
  cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);
  drops=[];var n=reduced?24:90;
  for(var i=0;i<n;i++)drops.push({x:Math.random()*r.width,y:Math.random()*r.height,
    l:8+Math.random()*20,s:3+Math.random()*5,a:.08+Math.random()*.3});}
function drawRain(){var r=phone.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);
  if(!rainOn)return;cx.lineWidth=1;
  for(var i=0;i<drops.length;i++){var d=drops[i];
    cx.strokeStyle='rgba(190,215,232,'+d.a+')';
    cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x-2.6,d.y+d.l);cx.stroke();
    d.y+=d.s*2.1;d.x-=1.1;if(d.y>r.height){d.y=-d.l;d.x=Math.random()*r.width;}}}
sizeRain();addEventListener('resize',sizeRain);

/* ================= figures ================= */
function fig(o){
  return '<div class="fig '+(o.cls||'')+'" style="--x:'+o.x+';--y:'+o.y+';--w:'+o.w+
    ';--tone:'+(o.tone||'#151C24')+';--tone2:'+(o.tone2||o.tone||'#0D131A')+
    ';--hair:'+(o.hair||'#080C11')+';--rim:'+(o.rim||'rgba(120,180,210,.9)')+
    ';--rimx:'+(o.rimx||'4px')+';--th:'+(o.th||'62%')+'">'+
    '<div class="head"><div class="hair '+(o.bun?'bun':'')+'"></div>'+
      (o.eyes===false?'':'<div class="eye l"></div><div class="eye r"></div><div class="mouth"></div>')+
    '</div><div class="neck"></div><div class="torso"></div></div>';
}

/* ================= shots ================= */
var RATHORE={x:'50%',y:'30%',w:'54%',tone:'#1A222B',tone2:'#0F151C',hair:'#0A0E13',rim:'rgba(110,170,205,.9)'};
var VIDYA  ={x:'50%',y:'26%',w:'50%',tone:'#1E2229',tone2:'#12171E',hair:'#07090D',bun:1,rim:'rgba(240,180,120,.85)',rimx:'-4px'};
var BOY    ={x:'50%',y:'22%',w:'30%',tone:'#1C2229',tone2:'#141A21',hair:'#080B10',rim:'rgba(240,190,130,.9)',th:'52%'};

var SHOTS={
  desk:'<div class="env env-office"></div><div class="win"><div class="blind"></div></div>'+
    fig(Object.assign({},RATHORE,{y:'52%',w:'78%'}))+
    '<div class="prop doc" id="doc"><div class="hd">FIR 214/26 · CLOSURE</div>'+
    '<div class="ln t"></div><div class="ln"></div><div class="ln s"></div><div class="ln t"></div>'+
    '<div class="ln s"></div><div class="stamp"></div></div>',

  rathore:'<div class="env env-office"></div><div class="win" style="left:-8%;top:2%;width:86%;height:56%"><div class="blind"></div></div>'+
    fig(Object.assign({},RATHORE,{x:'52%',y:'2%',w:'96%'})),

  glass:'<div class="env env-glass"></div>'+
    '<div style="position:absolute;left:8%;top:12%;right:8%;bottom:10%;border:1px solid rgba(150,195,220,.22);'+
    'background:linear-gradient(160deg,rgba(140,190,215,.09),rgba(30,50,66,.04))"></div>'+
    fig({x:'30%',y:'34%',w:'58%',tone:'#161D25',tone2:'#0E141B',hair:'#0A0E13',rim:'rgba(110,165,200,.5)',cls:'away'})+
    fig(Object.assign({},BOY,{x:'70%',y:'30%',w:'42%',rim:'rgba(240,196,136,.95)'}))+
    '<div class="shaft" style="left:14%;top:0;width:36%;height:70%;transform:rotate(9deg)"></div>',

  signing:'<div class="env env-office"></div>'+
    '<div class="prop doc" id="doc2" style="width:56%;left:22%;bottom:33%">'+
    '<div class="hd">FIR 214/26 · CLOSURE</div><div class="ln t"></div><div class="ln"></div>'+
    '<div class="ln s"></div><div class="ln t"></div><div class="ln s"></div><div class="stamp"></div>'+
    '<div class="torn" id="torn"></div></div>'+
    '<div class="shaft" style="left:20%;top:0;width:52%;height:56%"></div>',

  corridor:'<div class="env env-corridor"></div>'+
    '<div style="position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,rgba(240,190,130,.10),transparent)"></div>'+
    fig({x:'12%',y:'26%',w:'54%',tone:'#151B22',tone2:'#0D1218',hair:'#080B0F',rim:'rgba(240,190,130,.75)',cls:'away'})+
    fig({x:'90%',y:'24%',w:'56%',tone:'#151B22',tone2:'#0D1218',hair:'#080B0F',rim:'rgba(240,190,130,.75)',cls:'away'})+
    fig(Object.assign({},VIDYA,{x:'50%',y:'22%',w:'70%'}))+
    '<div class="prop mic" id="mic" style="opacity:0"></div>',

  bench:'<div class="env env-bench"></div>'+

    fig(Object.assign({},BOY,{x:'66%',y:'32%',w:'52%'}))+

/* ================= script ================= */
var B={
  PUSH:{v:'Push it back',g:'↑',dur:3400,clean:1500,type:'dragUp',
        got:'You didn’t sign it on the first ask. He noticed.'},
  LOOK:{v:'Don’t look away',g:'◉',dur:5200,clean:5200,type:'holdZone',need:2200,still:1,
        got:'You looked at the boy long enough to remember his face.'},
  TEAR:{v:'Tear it',g:'⇢',dur:3600,clean:1400,type:'swipeX',
        got:'You tore the closure report in half in front of the DCP.'},
  PUSH2:{v:'Push through',g:'⇄',dur:4600,clean:4600,type:'alt',need:6,
        got:'You got out of the building without saying a word to them.'},

  HOLD:{v:'Say nothing',g:'—',dur:4200,clean:3500,type:'hold',still:1,
        got:'You held still. You saw who was standing at the end of the corridor.'}
};
var ORDER=['PUSH','LOOK','TEAR','PUSH2','CATCH','KNEEL','UNFOLD','FOCUS','HOLD'];

// t = seconds. shot / sub / beat / cam / fx. `if` gates on a prior beat's tier.
var CUES=[
 {t:0.0, shot:'desk', cam:[1.14,'0px','2%',0]},
 {t:0.2, sub:['RATHORE','Sign it.']},
 {t:0.6, beat:'PUSH'},
 {t:4.4, sub:null},

 {t:4.6, shot:'rathore', cam:[1.0,'0px','0%',0]},
 {t:4.8, sub:['RATHORE','You have seven days of leave left. Take them.'], cam:[1.12,'0px','-1%',3200]},
 {t:8.2, sub:['VIDYA','He didn’t do it.']},
 {t:10.4,sub:['RATHORE','That stopped being the point on Tuesday.']},

 {t:13.6,shot:'glass', cam:[1.0,'0px','0%',0]},
 {t:13.8,sub:['','The boy has been on that floor since six.'], vo:1},
 {t:14.2,beat:'LOOK'},

 {t:19.9,shot:'signing', cam:[1.16,'0px','3%',0]},
 {t:20.1,sub:['RATHORE','Good. Sign, and it’s somebody else’s file.']},
 {t:22.6,beat:'TEAR'},
 {t:26.4,sub:null},

 {t:26.6,shot:'rathore', cam:[1.0,'0px','0%',0]},
 {t:26.8,sub:['RATHORE','You just ended your career.'], cam:[1.2,'0px','-2%',2600], if:'TEAR:!missed'},
 {t:26.8,sub:['RATHORE','Good girl.'], cam:[1.2,'0px','-2%',2600], if:'TEAR:missed'},
 {t:29.6,sub:['VIDYA','Then I’ve got seven days and nothing left to lose.'], if:'TEAR:!missed'},
 {t:29.6,sub:['','I signed it. I have thought about that every day since.'], vo:1, if:'TEAR:missed'},

 {t:33.4,shot:'corridor', cam:[1.05,'0px','2%',0]},
 {t:33.6,sub:['','Someone had already called the press.'], vo:1},
 {t:34.2,beat:'PUSH2'},
 {t:39.0,sub:null},
 {t:39.2,beat:'CATCH', fx:'mic'},
 {t:41.0,sub:['REPORTER','Inspector — is the guard confessing?']},
 {t:43.6,sub:null},

 {t:44.0,shot:'corridor', cam:[1.0,'0px','0%',900]},
 {t:44.2,sub:['FARHAN','Ma’am. The boy is still here.']},
 {t:46.8,sub:['FARHAN','Nobody’s come for him.']},

 {t:49.4,shot:'bench', cam:[1.22,'0px','-4%',0]},
 {t:50.0,beat:'KNEEL'},
 {t:55.8,sub:null},

 {t:56.0,shot:'twoshot', cam:[1.06,'0px','0%',1400]},
 {t:56.2,sub:['VIDYA','What’s your name?']},

 {t:60.2,sub:['BOY','Appa said you’d come.'], if:'KNEEL:!missed'},
 {t:60.2,sub:['BOY','…'], if:'KNEEL:missed'},
 {t:62.6,sub:['BOY','He said, the one who doesn’t shout.'], if:'KNEEL:clean'},

 {t:64.8,sub:['','He had been holding it since six as well.'], vo:1},

 {t:69.8,sub:null},

 {t:70.2,cam:[1.34,'2%','2%',2200]},
 {t:70.4,beat:'FOCUS'},
 {t:75.6,sub:null},

 {t:75.9,shot:'twoshot', cam:[1.0,'0px','0%',0]},
 {t:76.1,sub:['VIDYA','Ayaan. When did you see this person?']},
 {t:79.0,sub:['BOY','That night. She gave me a chocolate.']},
 {t:82.0,sub:['','She.'], vo:1},

 {t:84.4,shot:'reveal', cam:[1.0,'0px','0%',0]},
 {t:84.6,sub:['','There was someone at the end of the corridor.'], vo:1},
 {t:85.2,beat:'HOLD'},
 {t:89.6,sub:null},
 {t:89.8,cam:[1.5,'0px','-3%',3000], if:'HOLD:!missed'},
 {t:90.4,sub:['','She was smiling at the boy. She waved.'], vo:1, if:'HOLD:!missed'},
 {t:90.4,sub:['','By the time I turned, the corridor was empty.'], vo:1, if:'HOLD:missed'},
 {t:94.6,end:1}
];

/* ================= engine ================= */
var S={t:0,cur:0,tiers:{},running:false,clock:5*60+41,beat:null,bStart:0,bDone:false};
var raf=null,last=0;

function fmt(m){m=Math.floor(m)%1440;var h=Math.floor(m/60),x=m%60;
  return (h<10?'0':'')+h+':'+(x<10?'0':'')+x;}

function setShot(name,noFade){
  world.innerHTML='<div class="shot on">'+SHOTS[name]+'</div>';
}
function setCam(c){
  world.style.setProperty('--cd',(reduced?0:(c[3]||0))+'ms');
  requestAnimationFrame(function(){
    world.style.setProperty('--cs',c[0]);
    world.style.setProperty('--cx',c[1]);
    world.style.setProperty('--cy',c[2]);
  });
}
function setSub(s,vo){
  if(!s){subs.classList.add('hide');return;}
  subs.classList.remove('hide');
  whoEl.textContent=s[0]||'';whoEl.style.display=s[0]?'block':'none';
  lineEl.textContent=s[1];lineEl.classList.toggle('vo',!!vo);
}
function gate(cond){
  if(!cond)return true;
  var p=cond.split(':'),k=p[0],want=p[1],got=S.tiers[k]||'missed';
  if(want.charAt(0)==='!')return got!==want.slice(1);
  return got===want;
}

/* --------- dots --------- */
dotsEl.innerHTML=ORDER.map(function(){return '<i><b></b></i>'}).join('');
function markDot(i,tier){var d=dotsEl.children[i];d.setAttribute('data-t',tier);
  d.firstChild.style.width=tier==='missed'?'40%':'100%';}

/* --------- beats --------- */
var beatIdx=-1, hold={down:false,x:0,y:0,t0:0,acc:0,lastY:0,alt:0,hits:0,stage:0,dist:0};
function startBeat(key){
  S.beat=B[key];S.beat.key=key;S.bStart=performance.now();S.bDone=false;
  beatIdx=ORDER.indexOf(key);
  hold={down:false,x:0,y:0,t0:0,acc:0,lastY:0,alt:0,hits:0,stage:0,dist:0,fired:false};
  verbEl.textContent=S.beat.v;glyphEl.textContent=S.beat.g;
  promptEl.setAttribute('data-still',S.beat.still?'1':'0');
  promptEl.classList.add('on');
  if(S.beat.type==='alt'){tapL.classList.add('lit');}
  if(S.beat.type==='reflex'){glyphEl.style.opacity=.25;}
}
function endBeat(tier){
  if(S.bDone||!S.beat)return;S.bDone=true;
  S.tiers[S.beat.key]=tier;markDot(beatIdx,tier);
  S.clock += tier==='clean'?0:tier==='rough'?4:11;
  promptEl.classList.remove('on');
  tapL.classList.remove('lit');tapR.classList.remove('lit');
  glyphEl.style.opacity=1;
  var m=$('mic');if(m)m.style.opacity=0;
  if(tier==='clean'){flash(.18,140);}
  S.beat=null;
}
function flash(a,ms){flashEl.style.transition='none';flashEl.style.opacity=a;
  requestAnimationFrame(function(){flashEl.style.transition='opacity '+ms+'ms';flashEl.style.opacity=0;});}

/* --------- pointer --------- */
function rel(e){var r=phone.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}

phone.addEventListener('pointerdown',function(e){
  if(e.target.closest && e.target.closest('button,.dbrf'))return;
  e.preventDefault();
  if(!S.running)return;
  var p=rel(e),b=S.beat;
  if(!b||S.bDone)return;
  var el=performance.now()-S.bStart;

  if(b.type==='hold'){endBeat('missed');return;}           // any input fails
  if(b.type==='reflex'){
    if(el<b.delay){endBeat('missed');return;}
    var re=el-b.delay;
    endBeat(re<=b.clean?'clean':'rough');return;
  }
  if(b.type==='alt'){
    var side=p.x<.5?0:1;
    if(side===hold.alt){hold.hits++;hold.alt=1-hold.alt;
      tapL.classList.toggle('lit',hold.alt===0);tapR.classList.toggle('lit',hold.alt===1);
      flash(.06,110);
      if(hold.hits>=b.need)endBeat(el<b.dur*.72?'clean':'rough');}
    return;
  }
  hold.down=true;hold.x=p.x;hold.y=p.y;hold.lastY=p.y;hold.t0=performance.now();hold.dist=0;
  try{phone.setPointerCapture(e.pointerId);}catch(err){}
},{passive:false});

phone.addEventListener('pointermove',function(e){
  var b=S.beat;if(!b||S.bDone||!hold.down)return;
  e.preventDefault();
  var p=rel(e),el=performance.now()-S.bStart;
  var dx=p.x-hold.x, dy=p.y-hold.y;
  if(b.type==='holdZone'||b.type==='holdAny'){hold.x=p.x;hold.y=p.y;return;}

  if(b.type==='dragUp'){
    var d=$('doc');if(d)d.style.transform='translateY('+(Math.min(0,dy)*100)+'%) rotate('+(dx*14)+'deg)';
    if(dy<-.16)endBeat(el<b.clean?'clean':'rough');
  }
  else if(b.type==='swipeX'){
    hold.dist=Math.max(hold.dist,Math.abs(dx));
    var t=$('torn');
    if(t){t.style.opacity=Math.min(1,Math.abs(dx)*3.2);}
    var d2=$('doc2');
    if(d2)d2.style.transform='rotate('+(dx*10)+'deg) scaleY('+(1-Math.abs(dx)*.12)+')';
    if(Math.abs(dx)>.30&&Math.abs(dy)<.24){
      if(d2){d2.style.transition='transform .22s, opacity .3s';
        d2.style.transform='rotate('+(dx>0?16:-16)+'deg) translateY(14%)';d2.style.opacity=.25;}
      endBeat(el<b.clean?'clean':'rough');
    }
  }
  else if(b.type==='dragDown'){
    var f=$('fold');
    if(f){var k=Math.max(0,Math.min(1,dy*3));f.style.transform='rotateX('+(k*-118)+'deg)';f.style.opacity=1-k*.7;}
    if(dy>.19)endBeat(el<b.clean?'clean':'rough');
  }
  else if(b.type==='slowDrag'){
    var v=Math.abs(p.y-hold.lastY);
    hold.lastY=p.y;
    if(dy>0){
      world.style.setProperty('--cd','0ms');
      world.style.setProperty('--cy',(2-dy*11)+'%');
      world.style.setProperty('--cs',(1.22-dy*.30));
    }
    if(v>.055){hold.fired=true;}                            // jerked — too fast
    if(dy>.30)endBeat(hold.fired?'rough':'clean');
  }
  hold.lastY=p.y;
},{passive:false});

phone.addEventListener('pointerup',function(e){
  if(e.target.closest && e.target.closest('button,.dbrf'))return;
  e.preventDefault();hold.down=false;
  var b=S.beat;if(!b||S.bDone)return;
  if(b.type==='dragUp'){var d=$('doc');if(d)d.style.transform='';}
},{passive:false});
phone.addEventListener('pointercancel',function(){hold.down=false;});

/* --------- per-frame beat logic --------- */
function tickBeat(dt){
  var b=S.beat;if(!b||S.bDone)return;
  var el=performance.now()-S.bStart;
  arcEl.style.strokeDashoffset=(125.6*Math.min(1,el/b.dur)).toFixed(1);

  if(b.type==='holdZone'||b.type==='holdAny'){
    var ok=hold.down;
    if(b.type==='holdZone'&&hold.down){ok=(hold.x>.44&&hold.x<.98&&hold.y>.20&&hold.y<.68);}
    if(ok){hold.acc+=dt;glyphEl.style.color='var(--amber)';}
    else {hold.acc=Math.max(0,hold.acc-dt*.6);glyphEl.style.color='rgba(226,236,244,.45)';}
    if(b.type==='holdAny'){
      var f=$('draw');
      if(f)f.style.filter='blur('+(Math.max(0,1-hold.acc/b.need)*5).toFixed(2)+'px) saturate('+(0.35+0.65*Math.min(1,hold.acc/b.need)).toFixed(2)+')';
    }
    if(hold.acc>=b.need)endBeat(el<b.dur*.7?'clean':'rough');
  }
  if(b.type==='reflex'&&el>=b.delay&&!hold.fired){
    hold.fired=true;var m=$('mic');
    if(m){m.style.transition='transform .18s';m.style.opacity=1;m.style.transform='translateX(-140%)';}
    glyphEl.style.opacity=1;
  }
  if(b.type==='hold'){
    if(el>=b.clean){endBeat('clean');}
  }
  if(el>=b.dur)endBeat(b.type==='hold'?'clean':'missed');
}

/* --------- main loop --------- */
function loop(now){
  var dt=now-last;last=now;
  drawRain();
  if(S.running){
    S.t+=dt/1000;
    S.clock+=(dt/1000)*2;
    clockEl.textContent=fmt(S.clock);
    while(S.cur<CUES.length && CUES[S.cur].t<=S.t){
      var c=CUES[S.cur++];
      if(!gate(c.if))continue;
      if(c.shot){setShot(c.shot);}
      if(c.cam){setCam(c.cam);}
      if('sub' in c){setSub(c.sub,c.vo);}
      if(c.beat){startBeat(c.beat);}
      if(c.end){finish();}
    }
    tickBeat(dt);
  }
  raf=requestAnimationFrame(loop);
}

/* --------- interstitial + finish --------- */
function finish(){
  S.running=false;S.beat=null;promptEl.classList.remove('on');subs.classList.add('hide');
  var G={clean:'●',rough:'▲',missed:'✕'};
  var clean=0,rough=0,missed=0;
  var rows=ORDER.map(function(k){
    var t=S.tiers[k]||'missed';
    if(t==='clean')clean++;else if(t==='rough')rough++;else missed++;
    var txt = t==='missed'
      ? '<span style="opacity:.7">'+B[k].v+' — you didn’t.</span>'
      : B[k].got;
    return '<div class="row" data-t="'+t+'"><span class="g" style="color:'+
      (t==='clean'?'var(--amber)':t==='rough'?'var(--cold)':'rgba(199,80,72,.8)')+'">'+G[t]+'</span>'+
      '<span class="x">'+txt+'<small>'+B[k].v+'</small></span></div>';
  }).join('');

  var sawHer = S.tiers.HOLD && S.tiers.HOLD!=='missed';
  var sting = sawHer
    ? '<b>You saw her face.</b> Nothing in this episode told you to look, and nobody will mention her again until Day&nbsp;5. On Day&nbsp;6 that face is the case.'
    : '<b>You looked away.</b> There was a woman at the end of that corridor and she is the reason Anaya Sridhar is dead. You will meet her on Day&nbsp;3 and not know it.';

  $('dbrf').innerHTML=
    '<h2>05:41 &rarr; '+fmt(S.clock)+'</h2>'+
    '<div class="sb">Day 1 of 7 · '+clean+' clean · '+rough+' rough · '+missed+' missed</div>'+
    rows+
    '<div class="stinger">'+sting+'</div>'+
    '<div class="next"><div class="lbl">Day 2 opens in</div><div class="cd" id="cd">23:47:12</div></div>'+
    '<div style="text-align:center"><button class="btn" id="again">Play it again</button></div>';
  $('dbrf').classList.add('on');
  $('again').addEventListener('click',reset);
  var secs=23*3600+47*12;
  clearInterval(finish._i);
  finish._i=setInterval(function(){
    secs--;var el=$('cd');if(!el){clearInterval(finish._i);return;}
    var h=Math.floor(secs/3600),m=Math.floor(secs%3600/60),s=secs%60;
    el.textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  },1000);
}

function reset(){
  clearInterval(finish._i);
  $('dbrf').classList.remove('on');
  S={t:0,cur:0,tiers:{},running:false,clock:5*60+41,beat:null,bStart:0,bDone:false};
  Array.prototype.forEach.call(dotsEl.children,function(d){d.removeAttribute('data-t');d.firstChild.style.width='0'});
  subs.classList.remove('hide');
  world.innerHTML='';
  setTimeout(function(){S.running=true;last=performance.now();},220);
}

$('start').addEventListener('click',function(){
  $('opencard').classList.remove('on');
  S.running=true;last=performance.now();
});

last=performance.now();
raf=requestAnimationFrame(loop);
})();
</script>
