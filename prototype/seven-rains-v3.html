<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seven Rains Issue One</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
:root{
  --ink:#0B0B0F; --paper:#EFE6D2; --paper2:#E2D7BF; --amber:#F2A33A; --cold:#3E6B85;
  --night:#152233; --red:#C8352E; --khaki:#B9A57A;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#000}
body{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;color:var(--paper)}
#app{position:fixed;inset:0;display:grid;place-items:center;background:#000}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none}
@media (min-aspect-ratio:3/4){.phone{width:auto;height:100%;aspect-ratio:9/16;box-shadow:0 0 0 1px #222}}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;z-index:30;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;justify-content:space-between;align-items:center}
.hud .t{font-family:"Oswald",sans-serif;font-size:clamp(11px,1.6vh,13px);letter-spacing:.22em;text-transform:uppercase;color:var(--paper);opacity:.8}
.hud .clk{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(15px,2.2vh,19px);letter-spacing:.06em;
  color:var(--paper);background:var(--ink);padding:2px 8px;border:2px solid var(--paper);font-variant-numeric:tabular-nums}
.hud .clk.low{color:var(--red);border-color:var(--red)}
.seqbar{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:30;display:flex;gap:3px;pointer-events:none}
.seqbar i{flex:1;height:3px;background:rgba(239,230,210,.18)}
.seqbar i.done{background:var(--amber)}
.seqbar i.live{background:linear-gradient(90deg,var(--amber) var(--p,0%),rgba(239,230,210,.18) var(--p,0%))}

/* ---------- comic page ---------- */
.page{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 58px) 10px calc(env(safe-area-inset-bottom,0px) + 14px);
  display:grid;gap:8px;z-index:5;
  background:
    radial-gradient(rgba(0,0,0,.09) .6px,transparent .7px) 0 0/3px 3px,
    linear-gradient(180deg,#141318,#0E0E12)}
.page[data-l="1"]{grid-template-rows:1fr}
.page[data-l="2"]{grid-template-rows:1fr 1fr}
.page[data-l="3"]{grid-template-rows:1fr 1fr 1fr}
.page[data-l="21"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1.25fr}
.page[data-l="21"] .panel:nth-child(3){grid-column:1/3}
.page[data-l="21"] .panel:nth-child(-n+2) .bal,.page[data-l="12"] .panel:nth-child(n+2) .bal{max-width:86%;font-size:clamp(12px,1.85vh,15px)}
.page[data-l="12"]{grid-template-columns:1fr 1fr;grid-template-rows:1.25fr 1fr}
.page[data-l="12"] .panel:nth-child(1){grid-column:1/3}
.panel{position:relative;overflow:hidden;background:var(--night);border:4px solid var(--ink);
  box-shadow:0 0 0 2px var(--paper);opacity:0;transform:scale(.96);transition:opacity .22s,transform .22s}
.panel.on{opacity:1;transform:none}
.panel.tilt{transform:rotate(-1.2deg) scale(1.02)}
.panel.on.tilt{transform:rotate(-1.2deg) scale(1.02)}
.panel svg{position:absolute;inset:0;width:100%;height:100%}
.ht{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5;
  background:radial-gradient(rgba(0,0,0,.55) .7px,transparent .8px) 0 0/4px 4px}
.rain{position:absolute;inset:-20% 0 0 0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(104deg,transparent 0 9px,rgba(200,225,245,.55) 9px 10px,transparent 10px 22px);
  animation:rainfall .55s linear infinite}
@keyframes rainfall{to{transform:translate(-40px,120px)}}

/* captions, balloons, sfx */
.cap{position:absolute;z-index:3;background:var(--ink);color:var(--paper);padding:5px 9px 5px;
  font-family:"Oswald",sans-serif;font-size:clamp(11px,1.65vh,14px);letter-spacing:.06em;text-transform:uppercase;
  line-height:1.25;max-width:78%;border:2px solid var(--paper);opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s}
.cap.amber{background:var(--amber);color:var(--ink);border-color:var(--ink)}
.cap.on{opacity:1;transform:none}
.bal{position:absolute;z-index:4;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;
  padding:8px 11px;font-size:clamp(13px,2.05vh,17px);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.2;
  max-width:70%;opacity:0;transform:scale(.9);transition:opacity .16s,transform .16s;text-wrap:balance}
.bal.on{opacity:1;transform:none}
.bal.shout{border-radius:6px;font-size:clamp(15px,2.4vh,20px);background:var(--paper)}
.bal.think{border-style:dashed}
.bal.radio{border-radius:6px;background:#111;color:var(--paper);border-color:var(--paper)}
.bal::after{content:"";position:absolute;width:0;height:0;border:10px solid transparent}
.bal[data-t="bl"]::after{left:18px;bottom:-19px;border-top-color:var(--ink);border-right-width:4px}
.bal[data-t="br"]::after{right:18px;bottom:-19px;border-top-color:var(--ink);border-left-width:4px}
.bal[data-t="tl"]::after{left:18px;top:-19px;border-bottom-color:var(--ink);border-right-width:4px}
.bal[data-t="tr"]::after{right:18px;top:-19px;border-bottom-color:var(--ink);border-left-width:4px}
.bal.radio[data-t]::after{border-top-color:var(--paper)}
.bal .who{display:block;font-family:"Oswald",sans-serif;font-size:10px;letter-spacing:.2em;color:#7A6B57;margin-bottom:2px}
.bal.radio .who{color:var(--amber)}
.sfx{position:absolute;z-index:5;font-family:"Bangers",Impact,sans-serif;font-size:clamp(30px,5.4vh,52px);letter-spacing:.04em;
  color:var(--amber);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);transform:rotate(-8deg);opacity:0;transition:opacity .12s}
.sfx.on{opacity:1}
.sfx.red{color:var(--red)}
.tapcue{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:31;
  font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper);opacity:0;transition:opacity .3s;pointer-events:none}
.tapcue.on{opacity:.75;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- interaction layer ---------- */
.ix{position:absolute;inset:0;z-index:20;display:none;background:radial-gradient(rgba(0,0,0,.09) .6px,transparent .7px) 0 0/3px 3px,linear-gradient(180deg,#141318,#0E0E12)}
.ix.on{display:block}
.ixhud{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:22;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.ixhud .lbl{font-family:"Bangers",Impact,sans-serif;font-size:clamp(22px,3.6vh,34px);color:var(--paper);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);letter-spacing:.04em}
.ixhud .cnt{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(15px,2.2vh,19px);background:var(--paper);color:var(--ink);padding:3px 9px;border:2px solid var(--ink);font-variant-numeric:tabular-nums}
.ix .page{padding-top:calc(env(safe-area-inset-top,0px) + 116px)}
.ixbar{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 100px);height:6px;background:rgba(239,230,210,.2);border:2px solid var(--ink);z-index:22}
.ixbar i{display:block;height:100%;background:var(--amber);width:100%}
.howto{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);z-index:23;
  background:var(--ink);color:var(--paper);border:2px solid var(--paper);padding:8px 14px;font-family:"Oswald",sans-serif;
  font-size:clamp(12px,1.75vh,15px);letter-spacing:.14em;text-transform:uppercase;max-width:88%;text-align:center;pointer-events:none;transition:opacity .3s}
.howto.fade{opacity:0}

/* stamp */
.stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-10deg) scale(.6);z-index:40;pointer-events:none;
  font-family:"Bangers",Impact,sans-serif;font-size:clamp(54px,9.5vh,92px);letter-spacing:.06em;color:var(--amber);
  -webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink);opacity:0;transition:opacity .12s,transform .18s cubic-bezier(.2,1.6,.4,1)}
.stamp.on{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}
.stamp[data-t="rough"]{color:var(--paper)}
.stamp[data-t="missed"]{color:var(--red)}
.stamp small{display:block;font-family:"Oswald",sans-serif;font-size:clamp(12px,1.8vh,15px);letter-spacing:.2em;-webkit-text-stroke:0;text-shadow:none;color:var(--paper);margin-top:4px}

/* ---------- RUNNER ---------- */
.run{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#0E1826 0%,#1C2B3D 42%,#2B3846 43%,#1A232C 100%)}
.run .sky{position:absolute;left:0;right:0;top:0;height:42%;background:radial-gradient(60% 40% at 50% 100%,rgba(242,163,58,.25),transparent 70%)}
.run .bld{position:absolute;bottom:58%;background:var(--ink);border-top:3px solid #2A3644}
.run .road{position:absolute;left:0;right:0;top:42%;bottom:0;
  clip-path:polygon(40% 0,60% 0,118% 100%,-18% 100%);background:#232C36}
.run .stripes{position:absolute;left:0;right:0;top:42%;bottom:0;clip-path:polygon(40% 0,60% 0,118% 100%,-18% 100%);
  background:repeating-linear-gradient(180deg,transparent 0 30px,rgba(239,230,210,.16) 30px 44px);opacity:.9}
.run .lane{position:absolute;top:42%;bottom:0;width:3px;left:50%;background:rgba(239,230,210,.35);transform-origin:50% 0}
.run .ob{position:absolute;left:50%;top:42%;width:26%;aspect-ratio:1;transform:translate(-50%,-70%) scale(.2);will-change:transform}
.run .ob svg{width:100%;height:100%;overflow:visible}
.run .pl{position:absolute;left:50%;bottom:9%;width:32%;aspect-ratio:.8;transform:translateX(-50%);transition:left .13s cubic-bezier(.3,0,.2,1);will-change:transform,left}
.run .pl.jump{animation:jmp .5s ease-out}
@keyframes jmp{0%{transform:translate(-50%,0) scale(1)}45%{transform:translate(-50%,-38%) scale(1.06)}100%{transform:translate(-50%,0) scale(1)}}
.run .hitfx{position:absolute;inset:0;background:var(--red);opacity:0;pointer-events:none;mix-blend-mode:screen}
.run .speed{position:absolute;inset:0;pointer-events:none;opacity:.25;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(239,230,210,.5) 46px 47px,transparent 47px 90px);
  mask:linear-gradient(180deg,transparent 40%,#000 70%);-webkit-mask:linear-gradient(180deg,transparent 40%,#000 70%)}

/* ---------- SEARCH ---------- */
.srch{position:absolute;inset:0}
.srch .scene{position:absolute;inset:0}
.srch .scene svg{position:absolute;inset:0;width:100%;height:100%}
.hot{position:absolute;width:19%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);z-index:5}
.hot.found{pointer-events:none}
.hot.found::after{content:"";position:absolute;inset:8%;border:3px solid var(--amber);border-radius:50%;box-shadow:0 0 0 3px var(--ink)}
.inset{pointer-events:none;position:absolute;left:8%;right:8%;bottom:calc(env(safe-area-inset-bottom,0px) + 22%);z-index:8;background:var(--paper);color:var(--ink);
  border:4px solid var(--ink);box-shadow:0 0 0 2px var(--paper),8px 8px 0 var(--ink);padding:10px 12px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;
  opacity:0;transform:translateY(10px) rotate(-1deg);transition:opacity .18s,transform .18s}
.inset.on{opacity:1;transform:rotate(-1deg)}
.inset svg{width:64px;height:64px;border:3px solid var(--ink);background:#fff}
.inset b{font-family:"Oswald",sans-serif;font-size:clamp(11px,1.6vh,13px);letter-spacing:.16em;text-transform:uppercase;display:block;color:#7A6B57}
.inset span{font-size:clamp(14px,2.1vh,17px);font-weight:700;text-transform:uppercase;line-height:1.15}
.splat{position:absolute;transform:translate(-50%,-50%);font-family:"Bangers",Impact,sans-serif;font-size:clamp(20px,3.2vh,30px);color:var(--paper);
  -webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);pointer-events:none;animation:pop .6s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-110%) scale(1.2)}}

/* ---------- TIMING ---------- */
.tim{position:absolute;inset:0}
.tim .panelwrap{position:absolute;inset:calc(env(safe-area-inset-top,0px) + 116px) 10px calc(env(safe-area-inset-bottom,0px) + 14px)}
.tim .track{position:absolute;left:12%;right:12%;bottom:calc(env(safe-area-inset-bottom,0px) + 31%);height:26px;background:var(--paper);border:4px solid var(--ink);z-index:9}
.tim .zone{position:absolute;top:0;bottom:0;background:var(--amber)}
.tim .mk{position:absolute;top:-10px;bottom:-10px;width:8px;background:var(--ink);transform:translateX(-50%)}
.tim .arm{position:absolute;right:-6%;top:12%;width:64%;height:14%;background:var(--khaki);border:4px solid var(--ink);border-radius:14px 40px 40px 14px;
  transform-origin:100% 50%;transform:rotate(-38deg);transition:transform .9s cubic-bezier(.5,0,.8,.4);z-index:6}

/* ---------- HOLD / SWIPE ---------- */
.holdring{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8%);transform:translateX(-50%);width:clamp(74px,12vh,104px);height:clamp(74px,12vh,104px);z-index:9}
.holdring svg{width:100%;height:100%;transform:rotate(-90deg)}
.holdring .ic{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bangers",Impact,sans-serif;font-size:clamp(18px,2.8vh,24px);color:var(--paper);-webkit-text-stroke:1px var(--ink)}
.swipehand{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14%);transform:translateX(-50%);z-index:9;
  width:54px;height:54px;border:4px solid var(--amber);border-radius:50%;background:rgba(11,11,15,.6);animation:up 1s ease-in-out infinite}
@keyframes up{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-34px)}}

/* ---------- cards ---------- */
.card{position:absolute;inset:0;z-index:50;background:var(--ink);display:grid;place-content:center;text-align:center;padding:0 8%;
  opacity:0;pointer-events:none;transition:opacity .3s}
.card.on{opacity:1;pointer-events:auto}
.card .k{font-family:"Oswald",sans-serif;font-size:clamp(11px,1.6vh,13px);letter-spacing:.3em;text-transform:uppercase;color:var(--amber)}
.card h1{font-family:"Bangers",Impact,sans-serif;font-weight:400;font-size:clamp(54px,10vh,96px);line-height:.92;margin:10px 0 0;color:var(--paper);
  -webkit-text-stroke:2px var(--ink);text-shadow:6px 6px 0 var(--amber);letter-spacing:.03em}
.card h1 b{display:block;font-size:.5em;color:var(--amber);text-shadow:4px 4px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink)}
.card p{font-size:clamp(14px,2.1vh,17px);line-height:1.45;color:#BFB29A;max-width:32ch;margin:18px auto 0;font-weight:600}
.btn{margin-top:26px;appearance:none;border:3px solid var(--paper);background:var(--paper);color:var(--ink);
  font-family:"Bangers",Impact,sans-serif;font-size:clamp(20px,3vh,26px);letter-spacing:.08em;padding:10px 34px;cursor:pointer;box-shadow:5px 5px 0 var(--amber)}
.btn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--amber)}
.inter{position:absolute;inset:0;z-index:45;background:var(--amber);display:grid;place-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.inter.on{opacity:1}
.inter .n{font-family:"Oswald",sans-serif;font-size:clamp(12px,1.7vh,14px);letter-spacing:.3em;color:var(--ink);text-transform:uppercase}
.inter .h{font-family:"Bangers",Impact,sans-serif;font-size:clamp(40px,7vh,66px);color:var(--ink);line-height:1;margin-top:8px}

/* debrief */
.dbrf{position:absolute;inset:0;z-index:52;background:var(--paper);color:var(--ink);opacity:0;pointer-events:none;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 30px) 22px calc(env(safe-area-inset-bottom,0px) + 30px);transition:opacity .3s;
  background-image:radial-gradient(rgba(0,0,0,.08) .6px,transparent .7px);background-size:3px 3px}
.dbrf.on{opacity:1;pointer-events:auto}
.dbrf h2{font-family:"Bangers",Impact,sans-serif;font-weight:400;font-size:clamp(40px,6.8vh,60px);margin:0;line-height:.95;letter-spacing:.03em}
.dbrf .sub{font-family:"Oswald",sans-serif;font-size:clamp(11px,1.6vh,13px);letter-spacing:.22em;text-transform:uppercase;color:#7A6B57;margin:6px 0 18px}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:3px solid var(--ink)}
.res .n{font-family:"Bangers",Impact,sans-serif;font-size:22px;width:26px}
.res .w{font-weight:700;text-transform:uppercase;font-size:clamp(13px,2vh,16px)}
.res .w small{display:block;font-family:"Oswald",sans-serif;font-size:10px;letter-spacing:.18em;color:#7A6B57;font-weight:400}
.res .st{font-family:"Bangers",Impact,sans-serif;font-size:clamp(16px,2.4vh,20px);padding:2px 8px;border:3px solid var(--ink);transform:rotate(-4deg)}
.res .st.clean{background:var(--amber)}.res .st.rough{background:#fff}.res .st.missed{background:var(--red);color:#fff}
.map{margin-top:22px;border-top:3px solid var(--ink);padding-top:12px}
.map h3{font-family:"Oswald",sans-serif;font-size:clamp(11px,1.6vh,13px);letter-spacing:.24em;text-transform:uppercase;margin:0 0 10px;color:#7A6B57}
.seg{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:7px 0;border-top:2px solid rgba(11,11,15,.15);font-size:clamp(12px,1.8vh,14px);font-weight:600;text-transform:uppercase}
.seg b{font-family:"Oswald",sans-serif;font-weight:600;color:#7A6B57;letter-spacing:.06em}
.seg.done{background:linear-gradient(90deg,rgba(242,163,58,.35),transparent 70%);margin:0 -8px;padding:7px 8px}
.seg em{font-style:normal;color:var(--cold)}
</style>

<div id="app"><div class="phone" id="phone">

  <div class="hud"><div class="t">Seven Rains · Issue 1</div><div class="clk" id="clk">12:00</div></div>
  <div class="seqbar" id="seqbar"><i></i><i></i><i></i><i></i></div>

  <div class="page" id="page" data-l="1"></div>
  <div class="tapcue" id="tapcue">tap ▸</div>

  <div class="ix" id="ix"></div>
  <div class="stamp" id="stamp"></div>
  <div class="inter" id="inter"><div class="n" id="interN"></div><div class="h" id="interH"></div></div>

  <div class="card on" id="open">
    <div class="k">Case One · The Glasshouse · Day 1 of 7</div>
    <h1>Seven<br>Rains<b>First Rain</b></h1>
    <p>Sequence one of four. Read the panels — tap to turn. When the page hands you the wheel, it's a game. Nothing can be failed; the story just remembers.</p>
    <button class="btn" id="start">Open the case</button>
  </div>
  <div class="dbrf" id="dbrf"></div>

</div></div>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var phone=$('phone'),pageEl=$('page'),ix=$('ix'),stampEl=$('stamp'),tapcue=$('tapcue'),clk=$('clk');
var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ======================================================================
   ART — inked comic characters and scenes (SVG strings)
   ====================================================================== */
var INK='#0B0B0F', SW=3.5;
var CH={
  vidya:  {skin:'#C98C5C',shirt:'#B9A57A',hair:'#0B0B0F',style:'bun'},
  rathore:{skin:'#B47C4E',shirt:'#A8935F',hair:'#0B0B0F',style:'cap',moust:1},
  salim:  {skin:'#9A6A45',shirt:'#2E3A52',hair:'#5B5B5B',style:'skull',beard:1},
  ayaan:  {skin:'#C48B5A',shirt:'#B8362E',hair:'#0B0B0F',style:'messy',kid:1},
  farhan: {skin:'#C48B5A',shirt:'#B9A57A',hair:'#0B0B0F',style:'short'}
};
var uid=0;
function face(who,expr,flip){
  var c=CH[who];expr=expr||'neutral';var id='c'+(uid++);
  var brow={neutral:0,angry:12,sad:-12,det:5,worried:-8,shout:14}[expr]||0;
  var mouth={
    neutral:'M82,146 Q100,150 118,146',
    angry:'M80,152 Q100,140 120,152',
    sad:'M82,154 Q100,142 118,154',
    det:'M82,148 L118,146',
    worried:'M84,150 Q100,146 116,150',
    shout:'M84,140 Q100,168 116,140 Z',
    smile:'M80,144 Q100,160 120,144'
  }[expr];
  var kid=c.kid;
  var s='<g'+(flip?' transform="translate(200,0) scale(-1,1)"':'')+'>';

    // steps: panel reveal (with captions + sfx), then each balloon
    S.steps.push({panel:pi});
    p.items.forEach(function(it,ii){ if('bal' in it)S.steps.push({panel:pi,item:ii}); });
  });
  S.step=0;
  doStep();       // reveal first panel immediately
}
function storyClock(){ // story time: 05:40 + 2 min per real second... keep readable: minutes advance gently
  var m=5*60+52+Math.floor(S.t/6); var h=Math.floor(m/60),x=m%60; return (h<10?'0':'')+h+':'+(x<10?'0':'')+x; }

function doStep(){
  var st=S.steps[S.step];if(!st)return;
  var panel=pageEl.children[st.panel];
  if(st.item===undefined){
    panel.classList.add('on');
    panel.querySelectorAll('.cap,.sfx').forEach(function(e,k){setTimeout(function(){e.classList.add('on')},120+k*160);});
  } else {
    panel.querySelector('[data-step="'+st.panel+'.'+st.item+'"]').classList.add('on');
  }
  S.step++;idle=0;tapcue.classList.remove('on');
}
function advance(){
  if(S.busy||!S.running)return;
  if(S.step<S.steps.length){doStep();return;}
  var pg=PAGES[S.pg];
  if(pg.then&&!pg._done){pg._done=true;runIX(pg.then,function(){nextPage();});return;}
  nextPage();
}
function nextPage(){S.pg++;renderPage(S.pg);}

/* --- seq bar --- */
function seqbar(){var bars=$('seqbar').children;var p=Math.min(100,S.t/210*100);bars[0].className='live';bars[0].style.setProperty('--p',p+'%');}

/* --- stamp --- */
function stamp(tier,note){
  stampEl.setAttribute('data-t',tier);
  stampEl.innerHTML=(tier==='clean'?'CLEAN!':tier==='rough'?'ROUGH':'MISSED')+(note?'<small>'+note+'</small>':'');
  stampEl.classList.add('on');
  setTimeout(function(){stampEl.classList.remove('on')},900);
}
function record(key,tier,label){S.tiers[key]=tier;S.order.push({k:key,t:tier,l:label});}

/* --- tap handling on pages --- */
phone.addEventListener('pointerdown',function(e){
  if(e.target.closest&&e.target.closest('button,.dbrf'))return;
  e.preventDefault();
  if(ix.classList.contains('on'))return;   // interaction layer handles its own
  advance();
},{passive:false});

/* ======================================================================
   INTERACTIONS
   ====================================================================== */
var IXDONE=null;
function ixOpen(html){ix.innerHTML=html;ix.classList.add('on');S.busy=true;}
function ixClose(){ix.classList.remove('on');ix.innerHTML='';S.busy=false;}
function ixBar(el,frac){el.style.width=(Math.max(0,1-frac)*100)+'%';}
function runIX(name,done){IXDONE=done;IX[name]();}
function ixFinish(key,tier,label,note,delay){
  record(key,tier,label);stamp(tier,note);
  setTimeout(function(){ixClose();if(IXDONE)IXDONE();},delay||1000);
}
function rel(e){var r=phone.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}

var IX={};

/* --- SWIPE: answer the phone --- */
IX.swipe=function(){
  ixOpen('<div class="page" data-l="1" style="z-index:1"><div class="panel on">'+SC.bedroom+'<div class="ht"></div>'+
    '<div class="sfx on" style="top:30%;right:10%">BRRRR</div><div class="cap on" style="top:8px;left:8px">05:52 · Fourth ring.</div></div></div>'+
    '<div class="swipehand"></div><div class="howto">Swipe up to answer</div>');
  var t0=performance.now(),down=null,fin=false;
  function dn(e){down=rel(e);}
  function mv(e){if(!down||fin)return;var p=rel(e);if(down.y-p.y>.12){fin=true;off();
    var el=performance.now()-t0;ixFinish('swipe',el<2600?'clean':'rough','Answer the call',el<2600?'Second ring':'Fifth ring');}}
  function off(){ix.removeEventListener('pointerdown',dn);ix.removeEventListener('pointermove',mv);}
  ix.addEventListener('pointerdown',dn);ix.addEventListener('pointermove',mv);
  setTimeout(function(){if(!fin){fin=true;off();ixFinish('swipe','missed','Answer the call','It went to voicemail');}},6000);
};

/* --- RUNNER: ride through the flood (Subway Surfers) --- */
IX.runner=function(){
  var DUR=30000;
  ixOpen('<div class="run" id="run"><div class="sky"></div>'+
    '<div class="bld" style="left:0;width:18%;height:22%"></div><div class="bld" style="left:14%;width:10%;height:30%"></div>'+
    '<div class="bld" style="right:0;width:20%;height:26%"></div><div class="bld" style="right:16%;width:9%;height:34%"></div>'+
    '<div class="road"></div><div class="stripes" id="str"></div>'+
    '<div class="lane" style="transform:rotate(17deg)"></div><div class="lane" style="transform:rotate(-17deg)"></div>'+
    '<div class="speed"></div><div id="obs"></div>'+
    '<div class="pl" id="pl">'+scooter()+'</div><div class="hitfx" id="hitfx"></div><div class="rain"></div></div>'+
    '<div class="ixhud"><div class="lbl">RIDE!</div><div class="cnt" id="dodged">0</div></div><div class="ixbar"><i id="bar"></i></div>'+
    '<div class="howto" id="howto">Swipe ◂ ▸ to change lane · swipe ▴ to jump</div>');
  var pl=$('pl'),obsEl=$('obs'),bar=$('bar'),hitfx=$('hitfx'),str=$('str'),dodgedEl=$('dodged'),howto=$('howto');
  var lane=1,jumping=false,hits=0,dodged=0,obs=[],t0=performance.now(),lastSpawn=0,run=true,stripeY=0,down=null;
  var LANEX=[27,50,73];
  function setLane(){pl.style.left=LANEX[lane]+'%';}
  setLane();
  function spawn(now){
    var types=['auto','barr','pud'],ty=types[Math.floor(Math.random()*3)];
    var l=Math.floor(Math.random()*3);
    var d=document.createElement('div');d.className='ob';d.innerHTML=OBS[ty];obsEl.appendChild(d);
    obs.push({el:d,l:l,z:0,ty:ty,born:now,hit:false,passed:false});
  }
  function frame(now){
    if(!run)return;
    var el=now-t0,dt=16;
    var speed=1+Math.min(1,el/DUR)*.9;
    ixBar(bar,el/DUR);
    stripeY+=6*speed;str.style.backgroundPositionY=stripeY+'px';
    if(el>1800&&el<DUR-2200&&now-lastSpawn>(1050-Math.min(400,el/60))/speed){lastSpawn=now;spawn(now);}
    for(var i=obs.length-1;i>=0;i--){
      var o=obs[i];o.z=(now-o.born)/(1700/speed);
      if(o.z>1.15){o.el.remove();obs.splice(i,1);continue;}
      var z=Math.min(1.05,o.z),y=42+z*z*50,sc=.18+z*z*1.15,x=50+(o.l-1)*(6+z*z*26);
      o.el.style.transform='translate(-50%,-70%) scale('+sc+')';o.el.style.left=x+'%';o.el.style.top=y+'%';
      if(!o.hit&&!o.passed&&o.z>.86&&o.z<1.0&&o.l===lane){
        if(o.ty==='pud'&&jumping){}
        else{o.hit=true;hits++;hitfx.style.opacity=.55;setTimeout(function(){hitfx.style.opacity=0},140);
          pl.animate([{filter:'brightness(1)'},{filter:'brightness(3)'},{filter:'brightness(1)'}],220);
          var sp=document.createElement('div');sp.className='splat';sp.textContent=o.ty==='pud'?'SPLASH!':'THUNK!';sp.style.left='50%';sp.style.top='60%';ix.appendChild(sp);setTimeout(function(){sp.remove()},700);}
      }
      if(!o.hit&&!o.passed&&o.z>=1.0){o.passed=true;dodged++;dodgedEl.textContent=dodged;}
    }
    if(el>3500)howto.classList.add('fade');
    if(el>=DUR){run=false;
      var tier=hits===0?'clean':hits<=2?'rough':'missed';
      ixFinish('runner',tier,'Ride through the flood',hits===0?'Nine minutes, dry':hits<=2?'Fourteen minutes, soaked':'Twenty minutes. He had time.',1300);
      return;}
    requestAnimationFrame(frame);
  }
  function dn(e){down=rel(e);}
  function up(e){if(!down)return;var p=rel(e),dx=p.x-down.x,dy=p.y-down.y;down=null;
    if(Math.abs(dx)<.06&&Math.abs(dy)<.06){lane=p.x<.5?Math.max(0,lane-1):Math.min(2,lane+1);setLane();return;} // tap sides as fallback
    if(dy<-.08&&Math.abs(dy)>Math.abs(dx)){if(!jumping){jumping=true;pl.classList.add('jump');setTimeout(function(){jumping=false;pl.classList.remove('jump')},500);}return;}
    if(dx>.05)lane=Math.min(2,lane+1);else if(dx<-.05)lane=Math.max(0,lane-1);setLane();}
  ix.addEventListener('pointerdown',dn);ix.addEventListener('pointerup',up);
  requestAnimationFrame(frame);
};

/* --- TIMING: duck under the tape --- */
IX.timing=function(){
  ixOpen('<div class="tim"><div class="panelwrap"><div class="panel on tilt" style="position:absolute;inset:0">'+SC.rathoreTape+'<div class="ht"></div>'+
    '<div class="arm" id="arm"></div><div class="cap on" style="top:8px;left:8px">His arm comes down.</div></div></div>'+
    '<div class="track"><div class="zone" id="zone" style="left:41%;width:18%"></div><div class="mk" id="mk"></div></div>'+
    '<div class="ixhud"><div class="lbl">DUCK!</div></div><div class="howto">Tap when the marker is in the gold</div>');
  var mk=$('mk'),arm=$('arm'),t0=performance.now(),fin=false,run=true;
  setTimeout(function(){arm.style.transform='rotate(10deg)'},300);
  function frame(now){if(!run)return;var el=now-t0;var x=50+Math.sin(el/260)*44;mk.style.left=x+'%';mk._x=x;
    if(el>2600&&!fin){fin=true;run=false;ixFinish('timing','missed','Duck under the tape','He caught your sleeve');return;}
    requestAnimationFrame(frame);}
  function dn(){if(fin)return;fin=true;run=false;var d=Math.abs(mk._x-50);
    var tier=d<5?'clean':d<9?'rough':'missed';
    var sp=document.createElement('div');sp.className='sfx on'+(tier==='missed'?' red':'');sp.textContent=tier==='missed'?'GRAB':'SWISH';sp.style.cssText='top:48%;left:14%;z-index:9';ix.appendChild(sp);
    ixFinish('timing',tier,'Duck under the tape',tier==='clean'?'Under and gone':tier==='rough'?'Clipped the tape':'He caught your sleeve');}
  ix.addEventListener('pointerdown',dn);
  requestAnimationFrame(frame);
};

/* --- SEARCH: three details at the scene --- */
IX.search=function(){
  var DUR=22000;
  var hots=[
    {x:18,y:71,real:1,key:'hand',t:'Her left hand',d:'Nails broken. Left only. She grabbed — upward.',art:'<svg viewBox="0 0 60 60"><path d="M8,50 C10,30 20,24 30,26 L34,14 L40,16 L38,30 L48,34 L46,44 L36,42 L32,52Z" fill="#C98C5C" stroke="#0B0B0F" stroke-width="3"/><path d="M36,14 L40,10 M46,34 L52,30" stroke="#C8352E" stroke-width="3"/></svg>'},
    {x:88,y:70,real:1,key:'phone',t:'The phone',d:'Four metres from her hand. Screen up. Bone dry.',art:'<svg viewBox="0 0 60 60"><rect x="18" y="8" width="24" height="44" rx="4" fill="#F2A33A" stroke="#0B0B0F" stroke-width="3"/><rect x="22" y="14" width="16" height="30" fill="#FBE3B4"/><path d="M6,14 L12,20 M6,26 L12,30" stroke="#8FB6CC" stroke-width="3"/></svg>'},
    {x:40,y:45,real:1,key:'rail',t:'The rail',d:'Grey enamel, repainted Thursday. Still soft.',art:'<svg viewBox="0 0 60 60"><path d="M6,40 L54,14" stroke="#59667A" stroke-width="10" stroke-linecap="round"/><path d="M6,40 L54,14" stroke="#8FB6CC" stroke-width="3" stroke-dasharray="4 6"/><circle cx="30" cy="27" r="6" fill="#B9B4A4" stroke="#0B0B0F" stroke-width="2"/></svg>'},
    {x:50,y:12,real:0},{x:74,y:34,real:0},{x:26,y:90,real:0},{x:66,y:88,real:0}
  ];
  ixOpen('<div class="srch"><div class="page" data-l="1" style="z-index:1"><div class="panel on" id="spanel">'+SC.scene+'<div class="ht"></div>'+
    '<div class="cap on" style="top:8px;left:8px">Look before he makes you leave.</div></div></div>'+
    '<div class="inset" id="inset"></div>'+
    '<div class="ixhud"><div class="lbl">LOOK.</div><div class="cnt" id="found">0 / 3</div></div><div class="ixbar"><i id="bar"></i></div>'+
    '<div class="howto" id="howto">Tap the details that don\'t fit</div>');
  var panel=$('spanel'),inset=$('inset'),bar=$('bar'),foundEl=$('found'),found=0,t0=performance.now(),run=true,penalty=0;
  hots.forEach(function(h){var d=document.createElement('div');d.className='hot';d.style.left=h.x+'%';d.style.top=h.y+'%';
    d.addEventListener('pointerdown',function(e){e.stopPropagation();if(!run)return;
      if(h.real&&!h.done){h.done=true;found++;d.classList.add('found');foundEl.textContent=found+' / 3';
        inset.innerHTML=h.art+'<div><b>'+h.t+'</b><span>'+h.d+'</span></div>';inset.classList.add('on');
        clearTimeout(inset._t);inset._t=setTimeout(function(){inset.classList.remove('on')},2600);
        if(found===3){run=false;var el=performance.now()-t0;ixFinish('search',el<13000?'clean':'rough','Read the scene',el<13000?'Three details, fast':'Three details, slow',1400);}
      } else if(!h.real){penalty+=1500;var sp=document.createElement('div');sp.className='splat';sp.textContent='...';
        sp.style.left=h.x+'%';sp.style.top=h.y+'%';panel.appendChild(sp);setTimeout(function(){sp.remove()},700);}
    });
    panel.appendChild(d);});
  function frame(now){if(!run)return;var el=now-t0+penalty;ixBar(bar,el/DUR);if(el>3500)$('howto').classList.add('fade');
    if(el>=DUR){run=false;ixFinish('search',found>=2?'rough':'missed','Read the scene',found>=2?'Two of three':'You saw what he wanted you to see',1200);return;}
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
};

/* --- HOLD: hold your ground --- */
IX.hold=function(){
  var NEED=3200,DUR=6000;
  ixOpen('<div class="page" data-l="1" style="z-index:1"><div class="panel on">'+SC.rathoreShout+'<div class="ht"></div>'+
    '<div class="bal on shout" data-t="br" style="top:8px;left:8px"><span class="who">RATHORE</span>Are you deaf, Ramanathan? GO. HOME.</div></div></div>'+
    '<div class="holdring"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="rgba(239,230,210,.25)" stroke-width="5"/>'+
    '<circle id="harc" cx="22" cy="22" r="19" fill="none" stroke="#F2A33A" stroke-width="5" stroke-dasharray="119.4" stroke-dashoffset="119.4" stroke-linecap="round"/></svg><div class="ic">HOLD</div></div>'+
    '<div class="ixhud"><div class="lbl">STAND.</div></div><div class="howto">Press and hold until he\'s done</div>');
  var arc=$('harc'),t0=performance.now(),down=false,acc=0,lastT=t0,fin=false,released=0;
  function dn(){down=true;}function up(){if(down)released++;down=false;}
  ix.addEventListener('pointerdown',dn);ix.addEventListener('pointerup',up);ix.addEventListener('pointercancel',up);
  function frame(now){if(fin)return;var dt=now-lastT;lastT=now;var el=now-t0;
    if(down)acc+=dt;
    arc.style.strokeDashoffset=(119.4*(1-Math.min(1,acc/NEED))).toFixed(1);
    if(acc>=NEED){fin=true;ixFinish('hold',released===0?'clean':'rough','Hold your ground',released===0?'You didn\'t blink':'You looked down once');return;}
    if(el>=DUR){fin=true;ixFinish('hold','missed','Hold your ground','You stepped back');return;}
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
};

/* ======================================================================
   FLOW
   ====================================================================== */
function loop(now){
  var dt=(now-last)/1000;last=now;
  if(S.running){S.t+=dt;idle+=dt;
    var left=EP_LEN-S.t;clk.textContent=fmt(left);clk.classList.toggle('low',left<120);
    seqbar();
    if(idle>4&&!S.busy&&S.steps.length)tapcue.classList.add('on');
  }
  requestAnimationFrame(loop);
}
function finish(){
  S.running=false;
  var bars=$('seqbar').children;bars[0].className='done';
  var G={clean:'●',rough:'▲',missed:'✕'};
  var rows=S.order.map(function(r,i){return '<div class="res"><span class="n">'+(i+1)+'</span><span class="w">'+r.l+'<small>'+
    ({swipe:'QTE · swipe',runner:'Mini-game · lane runner · 30s',timing:'QTE · timing tap',search:'Mini-game · spot the clue · 22s',hold:'QTE · hold'})[r.k]+'</small></span>'+
    '<span class="st '+r.t+'">'+({clean:'CLEAN',rough:'ROUGH',missed:'MISSED'})[r.t]+'</span></div>';}).join('');
  var used=fmt(S.t);
  $('dbrf').innerHTML='<h2>End of<br>Sequence One</h2><div class="sub">'+used+' of 12:00 used · 5 interaction moments · 9 pages</div>'+rows+
    '<div class="map"><h3>Issue 1 pacing map — where this sits in the 12 minutes</h3>'+
    '<div class="seg done"><b>0:00</b><span>The Call — <em>swipe · lane runner · timing · spot-the-clue · hold</em></span></div>'+
    '<div class="seg"><b>3:30</b><span>The Guard — <em>tell-tap interrogation · log scrubber · swipe-slash the press · slam</em></span></div>'+
    '<div class="seg"><b>6:15</b><span>The Fourth Floor — <em>stair rhythm · desk search · focus the photo · say nothing</em></span></div>'+
    '<div class="seg"><b>9:00</b><span>The Boy — <em>lane driving · kneel · unfold · look closer · the last look</em></span></div></div>'+
    '<div style="text-align:center"><button class="btn" id="again">Read it again</button></div>';
  $('dbrf').classList.add('on');
  $('again').addEventListener('click',function(){
    $('dbrf').classList.remove('on');PAGES.forEach(function(p){delete p._done});
    S={pg:0,step:0,steps:[],running:false,t:0,tiers:{},order:[],busy:false};
    for(var i=0;i<4;i++)bars[i].className='';
    setTimeout(function(){S.running=true;renderPage(0);},250);
  });
}
$('start').addEventListener('click',function(){$('open').classList.remove('on');S.running=true;renderPage(0);});
requestAnimationFrame(loop);
})();
